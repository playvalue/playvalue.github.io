<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="lvTop"><rect x="0" y="0" width="32" height="16"/></clipPath>
    <clipPath id="lvBot"><rect x="0" y="16" width="32" height="16"/></clipPath>
    <clipPath id="lvMid"><rect x="12.5" y="0" width="9" height="32"/></clipPath>
  </defs>
  <!-- Before the play, the 30-second window after it (gold), and what follows. -->
  <rect x="1" y="1" width="10" height="30" rx="3.5" fill="#243552"/>
  <rect x="12.5" y="1" width="9" height="30" rx="2" fill="#E9A23B"/>
  <rect x="23" y="1" width="8" height="30" rx="3.5" fill="#243552"/>
  <!-- Zero line and the gold gap: blue above zero, red below, knocked out in navy inside the window. -->
  <path d="M2 16H30" stroke="#4A5A73" stroke-width="1.1"/>
  <path d="M2.5 20C6.5 20 9 21.5 12.5 20.5S17 11.5 20.5 11 25.5 12.5 29.5 8.5" fill="none" stroke="#F2697A" stroke-width="2.6" stroke-linecap="round" clip-path="url(#lvBot)"/>
  <path d="M2.5 20C6.5 20 9 21.5 12.5 20.5S17 11.5 20.5 11 25.5 12.5 29.5 8.5" fill="none" stroke="#4FB0F0" stroke-width="2.6" stroke-linecap="round" clip-path="url(#lvTop)"/>
  <path d="M2.5 20C6.5 20 9 21.5 12.5 20.5S17 11.5 20.5 11 25.5 12.5 29.5 8.5" fill="none" stroke="#172133" stroke-width="2.6" stroke-linecap="round" clip-path="url(#lvMid)"/>
  <!-- The play. -->
  <circle cx="12.5" cy="20.5" r="2.5" fill="#fff" stroke="#172133" stroke-width="1"/>
</svg>
