  <style>
    /* Achromatic ledger: the chrome is ink on a blue-grey ground; hue is kept for data only: the two sides'
       colours, gain and loss, and the brand's gold on the selected play and the plays worth a look. */
    :root {
      --bg-main: #f4f5f7;
      --bg-header: #f7f3ec;
      --header-control: #fffdf9;
      --header-border: #e4d7c5;
      --bg-card: #ffffff;
      --bg-card-hover: #f6f7f8;
      --bg-pill: #eceef1;
      --text-main: #111214;
      --text-muted: #5d6168;
      --border-color: #e4e6ea;
      --border-focus: #111214;
      --shadow-md: 0 6px 20px rgba(17, 18, 20, 0.10);
      --blue-team: #1d63b8;
      --blue-bg: #e7effa;
      --red-team: #c4243f;
      --red-bg: #fbe8ec;
      --gain: #247b50;
      --gain-bg: #e2f4e9;
      --loss: #b53d0c;
      --loss-bg: #fbeae1;
      --neutral: #62666d;
      --neutral-bg: #eceef1;
      --accent: #95580d;
      --accent-bg: rgba(185, 115, 26, 0.10);
      --f-objective_hunt: var(--neutral); --f-objective_contest: var(--neutral); --f-structure: var(--neutral); --f-gank: var(--neutral); --f-fight: var(--neutral);
      --f-lane: var(--neutral); --f-defense: var(--neutral); --f-vision: var(--neutral); --f-other: var(--neutral); --star: #b9731a;
      --chart-grid: #e9ebee;
      --chart-axis: #686c73;
      --brand-gold: #B9731A;
      --radius-card: 8px; --radius-control: 6px;
      --motion-fast: 140ms; --motion-medium: 260ms; --motion-emphasis: 420ms;
      --ease-out: cubic-bezier(.2, .8, .2, 1);
      color-scheme: light;
      --font: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg-main: #0d0d0e;
      --bg-header: #171512;
      --header-control: #211e1a;
      --header-border: #3a3024;
      --bg-card: #161618;
      --bg-card-hover: #1d1d20;
      --bg-pill: #242427;
      --text-main: #f3f3f4;
      --text-muted: #a9abb0;
      --border-color: #2a2a2e;
      --border-focus: #f3f3f4;
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);
      --blue-team: #5ea3ff;
      --blue-bg: #17243a;
      --red-team: #ff6d83;
      --red-bg: #3a1a21;
      --gain: #3fc07a;
      --gain-bg: #172a1d;
      --loss: #ff8a52;
      --loss-bg: #34200f;
      --neutral: #a0a2a8;
      --neutral-bg: #242427;
      --accent: #e9a23b;
      --accent-bg: rgba(233, 162, 59, 0.14);
      --star: #e9a23b;
      --chart-grid: #262629;
      --chart-axis: #9a9ca2;
      --brand-gold: #E9A23B;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg-main); scrollbar-gutter: stable; }
    /* Korean wraps between words, not inside them. */
    html[lang="ko"] body, html[lang="zh-CN"] body, html[lang="ja"] body { word-break: keep-all; overflow-wrap: break-word; }
    body {
      background: var(--bg-main); color: var(--text-main);
      font-family: var(--font); font-feature-settings: 'tnum' 0;
      line-height: 1.5; padding-bottom: 60px; transition: background-color .2s, color .2s;
    }
    button { font: inherit; color: inherit; }
    button, a, summary, select, input, [role="button"] { touch-action: manipulation; }
    :focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; border-radius: 4px; }
    .skip { position: absolute; left: 12px; top: -48px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-focus); border-radius: 8px; padding: 6px 12px; z-index: 100; }
    .skip:focus { top: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .logo-title { font-size: inherit; margin: 0; }
    .card h3, .play-title { text-wrap: balance; }
    .row .t, .row .e, .xt td, .meta strong, .hz .val, .time, .gbtn, .series-score .n { font-variant-numeric: tabular-nums; }
    button.row { width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--border-color); border-left: 3px solid transparent; font: inherit; color: inherit; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
    a { color: var(--text-main); text-underline-offset: 2px; }
    .container { max-width: 1440px; margin: 0 auto; padding: 0 20px; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--text-muted); }

    header { background: var(--bg-header); border-bottom: 1px solid var(--header-border); padding: 14px 0 0; transition: background-color .2s, border-color .2s; }
    .num, .time, .row .t, .row .e, .hz .val, .xt td, .meta strong, .gbtn, .ser-select { font-variant-numeric: tabular-nums; }
    .header-row { display: flex; flex-wrap: nowrap; justify-content: space-between; align-items: center; gap: 12px; }
    .header-copy { flex: 1 1 auto; min-width: 0; }
    .logo-title { display: flex; align-items: center; gap: 10px; }
    .logo-brand-link { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .logo-mark { width: 34px; height: 34px; }
    .logo-text { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.03em; }
    .logo-text-val { color: var(--brand-gold); }
    .logo-badge { background: var(--bg-pill); color: var(--text-muted); font-size: .75rem; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
    /* The product's message under the wordmark: a question in ink, then one plain sentence of what is measured. */
    .tagline { display: flex; align-items: baseline; gap: 6px; min-width: 0; margin-top: 6px; color: var(--text-muted); white-space: nowrap; }
    .tagline strong { flex: none; color: var(--text-main); font-size: 1.12rem; font-weight: 700; letter-spacing: -0.01em; }
    .tagline span { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: .9rem; }
    html[lang="en"] .tagline span { font-size: .84rem; letter-spacing: -0.012em; }
    .header-actions { display: flex; gap: 8px; flex: none; flex-wrap: nowrap; align-items: center; }
    header .btn, header .ser-step, header select.ser-select, header .gbtn:not(.on), header .seg button.on { background: var(--header-control); }
    .btn { background: var(--bg-card); border: 1px solid var(--border-color); font-size: .82rem; font-weight: 600; padding: 6px 12px; border-radius: var(--radius-control); cursor: pointer; text-decoration: none; color: var(--text-main); display: inline-flex; gap: 6px; align-items: center; }
    .btn:hover { border-color: var(--border-focus); }
    .btn.icon-only { width: 36px; height: 36px; padding: 0; justify-content: center; flex: none; }
    .btn.icon-only svg { width: 18px; height: 18px; display: block; }
    .lang-picker { position: relative; }
    .lang-flag { font-size: 1.12rem; line-height: 1; filter: saturate(.92); }
    .lang-menu { position: absolute; z-index: 80; top: calc(100% + 8px); right: 0; min-width: 174px; padding: 6px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; box-shadow: var(--shadow-md); }
    .lang-menu[hidden] { display: none; }
    .lang-option { width: 100%; display: grid; grid-template-columns: 24px 1fr 14px; align-items: center; gap: 8px; border: 0; border-radius: 7px; padding: 8px 9px; background: transparent; color: var(--text-main); cursor: pointer; text-align: left; font-size: .84rem; }
    .lang-option:hover, .lang-option:focus-visible { background: var(--bg-pill); }
    .lang-option .check { opacity: 0; color: var(--accent); font-weight: 800; }
    .lang-option.on .check { opacity: 1; }
    #btnTheme .theme-sun { display: none; }
    [data-theme="dark"] #btnTheme .theme-moon { display: none; }
    [data-theme="dark"] #btnTheme .theme-sun { display: block; }

    .navbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; padding: 14px 0; }
    .nav { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    .seg { display: inline-flex; background: var(--bg-pill); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
    .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: var(--radius-control); font-size: .82rem; font-weight: 600; cursor: pointer; color: var(--text-muted); }
    .seg button.on { background: var(--bg-card); color: var(--text-main); }
    .seg button:disabled { opacity: .5; cursor: not-allowed; }
    .seg .badge { font-size: .68rem; font-weight: 600; color: var(--text-muted); margin-left: 4px; }
    .nav-label { font-size: .75rem; color: var(--text-muted); font-weight: 600; }
    /* One row however many series there are: step through series, pick one from a grouped list, then a game. */
    .series { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
    .ser-pick { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; }
    .ser-step { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-size: 1.05rem; font-weight: 700; cursor: pointer; flex: none; }
    .ser-step:hover:not(:disabled) { border-color: var(--border-focus); }
    .ser-step:disabled { opacity: .35; cursor: default; }
    .series select.ser-select { height: 34px; font-size: .9rem; font-weight: 700; padding: 0 10px; min-width: 0; max-width: 100%; font-variant-numeric: tabular-nums; }
    .ser-count { font-size: .75rem; color: var(--text-muted); font-weight: 600; font-variant-numeric: tabular-nums; }
    .games { display: flex; gap: 4px; }
    .gbtn { width: 34px; height: 34px; border-radius: var(--radius-control); border: 1px solid var(--border-color); background: var(--bg-card); font-weight: 700; font-size: .85rem; cursor: pointer; position: relative; color: var(--text-main); }
    .gbtn:hover { border-color: var(--border-focus); }
    .gbtn .win { position: absolute; left: 7px; right: 7px; bottom: 4px; height: 3px; border-radius: 2px; }
    .gbtn.on { background: var(--text-main); color: var(--bg-card); border-color: var(--text-main); }
    .game-summary { display: inline-flex; align-items: baseline; gap: 6px; border-left: 1px solid var(--border-color); padding-left: 14px; white-space: nowrap; }
    .game-summary .matchup { font-size: .82rem; font-weight: 800; }
    .game-summary .match-meta { font-size: .75rem; color: var(--text-muted); font-weight: 600; }
    .guide { margin-top: 12px; font-size: .84rem; border-top: 1px solid var(--border-color); padding-top: 10px; }
    .guide summary { cursor: pointer; font-weight: 700; color: var(--text-main); }
    .guide dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin-top: 10px; max-width: 900px; }
    .guide dt { font-weight: 700; }
    .guide dd { color: var(--text-muted); }
    .hz-head { font-size: .78rem; color: var(--text-muted); font-weight: 700; margin-top: 12px; }

    /* main.container: .container's padding shorthand would otherwise reset the top space to 0. */
    main.container { padding-top: 20px; display: flex; flex-direction: column; gap: 16px; }
    .site-foot { margin-top: 32px; padding-top: 14px; padding-bottom: 28px; border-top: 1px solid var(--border-color); }
    .site-foot p { margin: 0; max-width: none; font-size: .75rem; line-height: 1.5; color: var(--text-muted); }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-card); padding: 20px; }
    .card h3 { font-size: 1rem; margin-bottom: 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .card h3 .sub, .xt-title .sub { font-size: .78rem; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
    .xt-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 14px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; text-wrap: balance; }

    .banner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .teams { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
    .teams .sub { font-size: .9rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0; }
    .team-blue { color: var(--blue-team); } .team-red { color: var(--red-team); }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .meta span { background: var(--bg-pill); border-radius: var(--radius-control); padding: 4px 10px; font-size: .8rem; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 12px; }

    .chart-wrap { position: relative; }
    #chart { width: 100%; height: auto; display: block; user-select: none; }
    #chart text { font-family: var(--font); font-variant-numeric: tabular-nums; font-size: 12px; fill: var(--chart-axis); }
    @keyframes chart-window-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes chart-anchor-in { from { opacity: .2; transform: scaleY(.2); } to { opacity: 1; transform: scaleY(1); } }
    @keyframes chart-pin-in { 0% { opacity: .4; transform: scale(.72); } 65% { transform: scale(1.18); } 100% { opacity: 1; transform: scale(1); } }
    #chart.chart-emphasize .chart-selection-window { animation: chart-window-in var(--motion-medium) var(--ease-out); }
    #chart.chart-emphasize .chart-selection-line { transform-box: fill-box; transform-origin: center; animation: chart-anchor-in var(--motion-emphasis) var(--ease-out); }
    #chart.chart-emphasize .pin.is-selected { transform-box: fill-box; transform-origin: center; animation: chart-pin-in var(--motion-emphasis) var(--ease-out); }
    .tip .gain { color: var(--gain); } .tip .loss { color: var(--loss); } .tip .neutral { color: var(--neutral); }
    .tip { position: absolute; pointer-events: none; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 9px; font-size: .75rem; box-shadow: var(--shadow-md); display: none; max-width: 280px; z-index: 5; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .75rem; color: var(--text-muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .legend i.hollow { background: transparent !important; border: 1.5px solid var(--neutral); }

    /* Game view: plays on the left, map and gold timeline as the main stage, and a selected-play inspector
       on the right. Match context lives in the navigation and panel heads, so the workspace starts at once. */
    .workspace { display: grid; grid-template-columns: minmax(290px, 4fr) minmax(500px, 7fr) minmax(340px, 5fr); gap: 16px; align-items: start; }
    /* The map and timeline are one continuous stage. Let the page scroll them together instead of
       creating a second, nested scrollbar inside the centre column. */
    .workspace-stage { display: flex; flex-direction: column; gap: 16px; }
    .detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
    .list-panel, .workspace-stage, .map-card, .timeline-card, .detail { min-width: 0; }
    .list-panel, .map-card, .timeline-card { padding: 16px; }
    .stage-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); }
    .stage-control { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .stage-toolbar .seg { flex-wrap: nowrap; }
    .map-card .mm { margin: 0; }
    .map-card .mm svg { width: min(100%, 680px); max-width: none; margin: 0 auto; }
    .map-guide { margin-top: 8px; font-size: .76rem; color: var(--text-muted); }
    .map-guide summary { cursor: pointer; font-weight: 700; color: var(--text-main); }
    .map-guide .note { text-align: left; margin-top: 6px; }
    .map-empty { min-height: 360px; display: grid; place-content: center; text-align: center; color: var(--text-muted); }
    .map-empty h3 { justify-content: center; color: var(--text-main); }
    .timeline-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 7px 12px; margin-bottom: 10px; }
    .timeline-head h3 { flex: 1 1 260px; margin-bottom: 0; }
    .timeline-finding { border: 0; border-radius: var(--radius-control); background: var(--accent-bg); color: var(--accent); padding: 5px 8px; font-size: .74rem; font-weight: 700; cursor: pointer; text-align: left; }
    .timeline-finding:hover { box-shadow: inset 0 0 0 1px var(--accent); }
    .timeline-card .guide { margin-top: 10px; }
    .timeline-card .legend { gap: 5px 12px; }
    .metric-beta { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); font-size: .68rem; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
    .list-coverage { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: -4px 0 10px; font-size: .75rem; color: var(--text-muted); }
    .list-coverage strong { color: var(--text-main); }
    .list-sort { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; margin-bottom: 10px; }
    .list-sort label { color: var(--text-muted); font-size: .75rem; font-weight: 700; }
    .list-sort select { width: 100%; min-width: 0; }
    /* The narrow left rail uses two lines per play: identity and value first, team and type below. */
    .list-panel .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .list-panel .filters select { width: 100%; min-width: 0; }
    .list-panel .filters .highlight-toggle, .list-panel .filters .btn { grid-column: 1 / -1; justify-self: start; }
    .list-panel .row { grid-template-columns: 48px minmax(0, 1fr) 92px; grid-template-areas: "time title gold" "team family gold"; gap: 3px 8px; padding: 8px 10px 8px 18px; position: relative; }
    .list-panel button.row { border-left: 0; }
    /* Keep the noteworthy marker visually separate from the time and title rather than using the
       row's border, which sat almost flush against its content. */
    .list-panel .row.star::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 3px; border-radius: 999px; background: var(--star); }
    .list-panel .row > :nth-child(1) { grid-area: time; }
    .list-panel .row > :nth-child(2) { grid-area: team; justify-self: start; }
    .list-panel .row > :nth-child(3) { grid-area: title; }
    .list-panel .row > :nth-child(4) { grid-area: family; }
    .list-panel .row > :nth-child(5) { grid-area: gold; align-self: center; text-align: right; }
    .list-panel .row.head { grid-template-areas: "time title gold"; }
    .list-panel .row.head > :nth-child(2), .list-panel .row.head > :nth-child(4) { display: none; }
    .list-panel .row .famcell .chip { white-space: normal; }
    @media (max-width: 1220px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .detail { position: static; max-height: none; overflow: visible; }
      .workspace-stage { order: -2; }
      .detail { order: -1; }
      .list-panel .row { grid-template-columns: 56px 52px minmax(0, 1fr) 170px 104px; grid-template-areas: none; gap: 10px; padding: 7px 10px 7px 18px; }
      .list-panel .row > :nth-child(n) { grid-area: auto; justify-self: auto; }
      .list-panel .row > :nth-child(2) { justify-self: center; }
      .list-panel .row > :nth-child(5) { text-align: initial; }
      .list-panel .row.head > :nth-child(2), .list-panel .row.head > :nth-child(4) { display: initial; }
      .list-panel .filters { display: flex; }
      .list-panel .filters select { width: auto; }
      .list-panel .filters .highlight-toggle, .list-panel .filters .btn { grid-column: auto; }
    }
    @media (max-width: 720px) {

<script>
(async () => {
  // index.json is small and read first; a game's full file and a tournament's light play list load on demand.
  let DATA;
  try {
    DATA = await (await fetch('./data/index.json', { cache: 'no-cache' })).json();
  } catch (e) {
    document.getElementById('main').innerHTML = '<section class="card"><p>데이터를 불러오지 못했습니다. 웹 서버로 열어 주세요.<br>Could not load the data. Open this page through a web server.</p></section>';
    return;
  }
  // WPS is an additive public-beta overlay. If it is unavailable, every existing gold view still works.
  let WPS_INDEX = null;
  try {
    const response = await fetch('./data/wps-v312/index.json', { cache: 'no-cache' });
    if (response.ok) WPS_INDEX = await response.json();
  } catch (e) { /* gold-only fallback */ }
  const D = DATA.display;
  const GAMES = DATA.games;
  const seriesOf = g => g.series || g.stage;
  // Each tournament has its own series; game 1 of its latest series opens first. Without a tournament, the one
  // with the most recently played game is taken, so the page opens on the newest series.
  const gamesIn = tid => GAMES.filter(g => g.tournament_id === tid);
  const latestTourn = () => GAMES.reduce((a, b) => ((b.date || '') > (a.date || '') ? b : a)).tournament_id;
  const firstGame = (tid = latestTourn()) => {
    const gs = gamesIn(tid);
    return gs.filter(g => seriesOf(g) === gs.map(seriesOf).sort().pop()).sort((a, b) => a.game_num - b.game_num)[0];
  };
  const PLAY = {};
  const LIGHT = {};
  const loading = {};
  const wpsLoading = {};

  // ------------------------------------------------------------------ text
  const T = {
    ko: {
      tagline: '팀의 관점에서 보는 플레이의 밸류',
      legal: 'PlayValue는 Riot Games의 보증을 받지 않았으며, Riot Games 또는 Riot Games 자산의 제작·관리에 공식적으로 관여하는 누구의 견해나 의견도 반영하지 않습니다. Riot Games 및 관련 모든 자산은 Riot Games, Inc.의 상표 또는 등록 상표입니다.',
      taglineSub: '킬 없는 플레이와 실패한 시도까지, 해설이 짚은 중요 플레이의 밸류를 직후 15·30·60초의 두 팀 골드 차이로 봅니다.',
      methodology: '방법론', lang: 'English', languagePicker: '언어 선택', themeDark: '다크 모드', themeLight: '라이트 모드',
      viewSet: '경기별 보기', viewXtab: '유형별 집계', winner: '승리',
      cov: (n, m, k) => `플레이 <strong>${n}</strong>건 중 골드 변화를 잰 것 <strong>${m}</strong>건, 그중 이득·손해가 판정된 것 <strong>${k}</strong>건`,

    if (!tour.plays_path || tour._plays) return;
    loading[tid] = loading[tid] || fetch('./' + tour.plays_path, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    const data = await loading[tid];
    Object.entries(data.games).forEach(([gid, x]) => {
      const g = GAMES.find(y => y.id === gid);
      if (!ROSTER[gid]) addRoster(g, x.roster);
      LIGHT[gid] = x.plays.map(p => { p._game = g; if (!PLAY[p.id]) PLAY[p.id] = p; return p; });
    });
    tour._plays = true;
  }
  // A loaded game's full plays, otherwise the light ones from the tournament list.
  const playsOf = g => (isFull(g) ? g.plays : LIGHT[g.id] || []);
  const wpsOf = p => (p?._game?._wpsPlays || {})[p.id] || null;
  const wpsHorizon = (p, h, flipped = false) => {
    const value = wpsOf(p)?.horizons?.[String(h)];
    if (!value || value.status !== 'valid' || value.observed_wps_pp == null) return null;
    return { ...value, observed_wps_pp: (flipped ? -1 : 1) * value.observed_wps_pp,
      p_actor_start: flipped ? 1 - value.p_actor_start : value.p_actor_start,
      p_actor_end: flipped ? 1 - value.p_actor_end : value.p_actor_end };
  };
  const hlOf = id => (HL_BY_H[S.h] || {})[id];
  const famChip = (key, text, extra = '') => `<span class="chip fam ${extra}" style="--c:var(--f-${key || 'other'})">${esc(text)}</span>`;
  const playerText = (g, name) => { const x = ROSTER[g.id][name]; return x ? `${name} (${posLabel(x.position)} · ${champName(x)})` : name; };

  function readHash() {
    const q = new URLSearchParams(location.hash.slice(1));
    if (q.get('game') && GAMES.some(g => g.id === q.get('game'))) { S.gameId = q.get('game'); S.tourn = GAMES.find(g => g.id === S.gameId).tournament_id; }
    if (q.get('play')) S.playId = q.get('play');
    if (q.get('view') === 'xtab') S.view = 'xtab';
    if (['15', '30', '60'].includes(q.get('h'))) S.h = q.get('h');
    if (WPS_INDEX && ['wps', 'gold', 'both'].includes(q.get('metric'))) S.metric = q.get('metric');
    if (['time', 'gold'].includes(q.get('sort')) || (WPS_INDEX && q.get('sort') === 'wps')) S.listSort = q.get('sort');
  }
  function writeHash() {
    const q = new URLSearchParams({ view: S.view, game: S.gameId, h: S.h, metric: S.metric, sort: S.listSort });
    if (S.playId) q.set('play', S.playId);
    history.replaceState(null, '', '#' + q.toString());
    trackView();
  }

  // ------------------------------------------------------------------ visit statistics
  // Umami's own page tracking is off: every play click rewrites the hash, which it would count as a page view.
  // A view is sent when the game or the tally changes; a few deliberate actions are events. Calls made before
  // the deferred script arrives wait in a queue; with the script blocked they go nowhere.
  const umQueue = [];
  const um = (...a) => (window.umami ? window.umami.track(...a) : umQueue.push(a));
  window.__umFlush = () => { while (umQueue.length) window.umami.track(...umQueue.shift()); };
  let lastView = '';
  function trackView() {
    const url = S.view === 'xtab' ? `/totals/${S.tourn}` : `/game/${S.gameId}`;
    if (url === lastView) return;
    lastView = url;
    const title = S.view === 'xtab' ? `Totals · ${S.tourn}` : `${game().title_en} · ${game().tournament_id}`;
    um(props => ({ ...props, url, title }));
  }

  // ------------------------------------------------------------------ perspective
  // Statistics always use the acting team. A team perspective only changes how a card reads:
  // the opponent's play is shown with E negated, and gank/defense swap names with the outcome flipped.
  const FLIP_OUTCOME = { success: 'failure', failure: 'success', mixed: 'mixed', aborted: 'aborted', unknown: 'unknown' };
  const FLIP_STATE = { positive: 'negative', negative: 'positive', unresolved: 'unresolved', missing: 'missing' };
  function viewOf(p) {
    const flipped = !!(S.persp && p.actor && p.actor !== S.persp);
    const swap = flipped && (p.family === 'gank' || p.family === 'defense');
    const hz = {};
    for (const [k, v] of Object.entries(p.horizons)) {
      hz[k] = !flipped || v.state === 'missing' ? v : { ...v, e: -v.e, state: FLIP_STATE[v.state] };
    }
    const outcome = swap ? FLIP_OUTCOME[p.outcome] : p.outcome;
    let tag = null;
    if (!flipped || swap) tag = tagFor(outcome, hz[S.h].state);
    return {
      flipped, swap, hz, outcome, tag,
      familyText: swap ? L('flipFamily', p.family) : famLabel(p.family),
      famKey: swap ? (p.family === 'gank' ? 'defense' : 'gank') : p.family,
      lead: p.context.lead_at_anchor == null ? null : (flipped ? -p.context.lead_at_anchor : p.context.lead_at_anchor),
      leadState: flipped ? ({ ahead: 'behind', behind: 'ahead', even: 'even' }[p.context.lead_state] || null) : p.context.lead_state,
      bgPct: p.context.background_pct[S.h] == null ? null : (flipped ? 100 - p.context.background_pct[S.h] : p.context.background_pct[S.h]),
    };
  }
  function tagFor(outcome, state) {
    for (const [name, c] of Object.entries(D.tags)) {
      if (c.state !== state) continue;
      if (c.outcome === '*' || c.outcome.includes(outcome)) return name;
    }
    return null;
  }
  const stateCls = s => (s === 'positive' ? 'gain' : s === 'negative' ? 'loss' : 'neutral');
  const tagCls = tg => (!tg ? 'neutral' : tg.endsWith('gain') ? 'gain' : tg.endsWith('loss') ? 'loss' : 'neutral');
  const eText = h => (h.state === 'missing' ? L('state', 'missing') : fmtG(h.e));

  // ------------------------------------------------------------------ chrome
  function renderChrome() {
    document.documentElement.lang = LANG_META[S.lang].html;
    document.documentElement.dataset.theme = S.theme;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelector('.tagline').title = `${t('tagline')} ${t('taglineSub')}`;
    const methodologyLink = document.getElementById('methodologyLink');
    methodologyLink.ariaLabel = methodologyLink.title = t('methodology');
    const langButton = document.getElementById('btnLang');
    const languageLabel = t('languagePicker') || T.en.languagePicker || 'Choose language';
    langButton.ariaLabel = langButton.title = languageLabel;
    langButton.querySelector('.sr-only').textContent = languageLabel;
    document.getElementById('langFlag').textContent = LANG_META[S.lang].flag;
    document.querySelectorAll('.lang-option').forEach(option => {
      const on = option.dataset.lang === S.lang;
      option.classList.toggle('on', on);
      option.setAttribute('aria-checked', String(on));
    });
    const themeButton = document.getElementById('btnTheme');
    const themeLabel = S.theme === 'dark' ? t('themeLight') : t('themeDark');
    themeButton.ariaLabel = themeButton.title = themeLabel;
    themeButton.querySelector('.sr-only').textContent = themeLabel;
    document.getElementById('verBadge').textContent = 'v' + DATA.version;
    document.getElementById('themeColor').content = S.theme === 'dark' ? '#0d0d0e' : '#f4f5f7';
    document.getElementById('skipLink').textContent = t('skip');

    const tt = document.getElementById('tournTabs');
    tt.innerHTML = DATA.tournaments.map(x => `<button data-t="${x.id}" class="${S.tourn === x.id ? 'on' : ''}">${esc(contentText(x, 'name'))}<span class="badge">${esc(contentText(x, 'badge'))}</span></button>`).join('');
    tt.querySelectorAll('button').forEach(b => b.onclick = () => {
      S.tourn = b.dataset.t;
      // Switching to a tournament with games opens its latest series; a planned one keeps the current game.
      if (gamesIn(S.tourn).length && game().tournament_id !== S.tourn) { S.gameId = firstGame(S.tourn).id; S.playId = null; S.persp = ''; S.xCell = null; S.fPlayer = ''; }

    const planned = (DATA.tournaments.find(x => x.id === S.tourn) || {}).status === 'planned';
    const vt = document.getElementById('viewTabs');
