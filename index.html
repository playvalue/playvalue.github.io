    const openSeries = s => openGame(gamesOf(s)[0].id);
    se.querySelectorAll('.gbtn').forEach(b => b.onclick = () => openGame(b.dataset.g));
    se.querySelectorAll('[data-context]').forEach(b => b.onclick = () => { S.view = b.dataset.context; if (S.view === 'stats') { S.statsScope = 'stage'; if (!['team', 'player'].includes(S.statsTab)) S.statsTab = 'team'; } render(); });
    se.querySelectorAll('[data-stats-team]').forEach(b => b.onclick = () => openStatsEntity('team', b.dataset.statsTeam, b.dataset.otherTeam));
    // The bar is rebuilt on every render, so keep keyboard focus on the control that was used.
    const refocus = id => { const el = document.getElementById(id); if (el && !el.disabled) el.focus(); };
    se.querySelector('#serSel').onchange = e => { openSeries(e.target.value); refocus('serSel'); };
  }

  // ------------------------------------------------------------------ set view
  // The game's largest clear change over the chosen window, from the acting team's side: the line under the title.
  const opponentOf = (g, team) => team === g.blue_team ? g.red_team : team === g.red_team ? g.blue_team : null;
  const beneficiaryOf = (g, p, value) => value > 0 ? p.actor : value < 0 ? opponentOf(g, p.actor) : null;
  const benefitText = (g, p, value, kind) => {
    const team = beneficiaryOf(g, p, value);
    const amount = kind === 'wps' ? `${Math.abs(value).toFixed(1)}pp` : Math.abs(value).toLocaleString();
    return team ? `${team} +${amount}` : `±${amount}`;
  };
  function findingOf(g) {
    let best = null;
    for (const p of g.plays) {
      if (S.metric !== 'gold' && g._wps) {
        const w = wpsHorizon(p, S.h);
        if (!w) continue;
        if (!best || Math.abs(w.observed_wps_pp) > Math.abs(wpsHorizon(best, S.h).observed_wps_pp)) best = p;
        continue;
      }
      const h = p.horizons[S.h];
      if (!h || (h.state !== 'positive' && h.state !== 'negative')) continue;
      if (!best || Math.abs(h.e) > Math.abs(best.horizons[S.h].e)) best = p;
    }
    return best;
  }

  function renderSet() {
    const g = game();
    const plays = g.plays;
    if (!S.playId || !PLAY[S.playId] || PLAY[S.playId]._game !== g) S.playId = plays[0].id;
    const main = document.getElementById('main');
    // Curves have a stable blue-team frame. Play cards stay with the acting team named by the casters.
    const f = findingOf(g);
    const findingRaw = f && S.metric !== 'gold' && g._wps ? wpsHorizon(f, S.h).observed_wps_pp : f ? f.horizons[S.h].e : null;
    const findingTeam = f && findingRaw != null ? beneficiaryOf(g, f, findingRaw) || f.actor : '';
    const findingValue = f && findingRaw != null ? (S.metric !== 'gold' && g._wps ? `+${Math.abs(findingRaw).toFixed(1)}pp` : `+${Math.abs(findingRaw).toLocaleString()}`) : '';
    main.innerHTML = `
      <div class="workspace">
        <section class="card list-panel" id="listCard"></section>
        <div class="workspace-stage" id="workspaceStage">
          <section class="card map-card" id="mapCard">
            <div class="stage-toolbar">
              <div class="stage-control"><span class="nav-label">${t('horizon')}</span><div class="seg" id="hSeg">${D.horizons_s.map(h => `<button data-h="${h}" class="${S.h === String(h) ? 'on' : ''}">${t('sec')(h)}</button>`).join('')}</div></div>
              ${g._wps ? `<div class="stage-control"><span class="nav-label">${t('metric')} <span class="metric-beta">v312 ${t('beta')}</span></span><div class="seg" id="metricSeg">${[['wps', t('metricWps')], ['gold', t('metricGold')], ['both', t('metricBoth')]].map(([k, v]) => `<button data-m="${k}" class="${S.metric === k ? 'on' : ''}">${esc(v)}</button>`).join('')}</div></div>` : ''}
            </div>
            <div id="mapSlot" aria-live="polite"></div>
          </section>
          <section class="card timeline-card">
            <div class="timeline-head">
              <h3>${t('chartTitle')} <span class="sub">${esc(t('chartSub')(S.h, g.blue_team, g.red_team))}</span></h3>
              ${f ? `<button class="timeline-finding" data-goto="${f.id}" title="${esc(t('finding')(S.h, clock(f), contentText(f, 'title'), findingTeam, findingValue))}">${esc(t('findingCompact')(S.h, clock(f), findingTeam, findingValue))}</button>` : ''}
            </div>
            <div class="chart-wrap"><svg id="chart" role="img" aria-label="${esc(t('chartTitle'))}"></svg><div class="tip" id="tip" aria-hidden="true"></div></div>
            <div class="legend">
              <span><i style="background:var(--blue-team)"></i>${t('lgBlue')}</span>
              <span><i style="background:var(--red-team)"></i>${t('lgRed')}</span>
              ${S.metric !== 'wps' ? `<span><i class="hollow"></i>${t('lgUnres')}</span>` : ''}
              <span><i style="background:var(--accent-bg);border:1px solid var(--accent)"></i>${t('lgWin')}</span>
              <span><i style="background:var(--chart-axis)"></i>${t('lgFlow')}</span>
              <span><i style="background:var(--accent)"></i>${t('lgObj')}</span>
            </div>
            <details class="guide" id="guide" ${S.guideOpen ? 'open' : ''}><summary>${t('guideTitle')}</summary>
              <dl>${(S.metric === 'gold' ? t('guide') : S.metric === 'wps' ? t('wpsGuide') : [...t('wpsGuide'), ...t('guide')]).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details>
          </section>
        </div>
        <aside class="card detail" id="playCard" aria-live="polite"></aside>
      </div>`;
    main.querySelector('#guide').ontoggle = e => { S.guideOpen = e.target.open; try { localStorage.setItem('lv_guide', S.guideOpen ? '1' : '0'); } catch (err) {} };
    main.querySelectorAll('#hSeg button').forEach(b => b.onclick = () => { S.h = b.dataset.h; renderSet(); });
    main.querySelectorAll('#metricSeg button').forEach(b => b.onclick = () => { S.metric = b.dataset.m; try { localStorage.setItem('lv_metric', S.metric); } catch (e) {} renderSet(); });
    main.querySelectorAll('.timeline-card [data-goto]').forEach(b => b.onclick = () => selectPlay(b.dataset.goto, true));
    renderCard(g);
    renderChart(g);
    renderList(g);
    writeHash();
    syncPressed();
  }

  // Choosing a play redraws only what shows it: the chart's marks, the detail panel and the list's selected row.
  // On one column the central stage sits above the inspector and list, so bring it into view.
  function selectPlay(id, reveal) {
    if (!PLAY[id]) return;
    S.playId = id;
    const g = PLAY[id]._game;
    renderChart(g, true);
    renderCard(g);
    let selectedRow = null;
    document.querySelectorAll('#listCard .row[data-id]').forEach(r => {
      const on = r.dataset.id === id;
      r.classList.toggle('on', on);
      if (on) selectedRow = r;
      if (on) r.setAttribute('aria-current', 'true'); else r.removeAttribute('aria-current');
    });
    animatePlaySelection(selectedRow);
    writeHash();
    syncPressed();
    const stage = document.getElementById('workspaceStage');
    if (reveal && stage && getComputedStyle(stage).position !== 'sticky') stage.scrollIntoView({ behavior: SMOOTH, block: 'start' });
  }

  function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function renderChart(g, emphasize = false) {
    const svg = document.getElementById('chart');
    const W = Math.max(320, Math.round(svg.parentElement.clientWidth || 1200));
    const narrow = W < 640;
    const padL = narrow ? 58 : 72, padR = 12, top = 10, sep = 28;
    const curveH = narrow ? 125 : 155, barH = narrow ? 72 : 88;
    const laneH = 22, lanes = 2, bottom = 24;
    const showWps = S.metric !== 'gold' && !!g._wps;
    const showGold = S.metric !== 'wps' || !g._wps;
    const tracks = [];
    let cursor = top;
    const addTrack = (id, kind, height) => { const track = { id, kind, top: cursor, height }; tracks.push(track); cursor += height + sep; return track; };
    const wpsCurveTrack = showWps ? addTrack('wpsCurve', 'curve', curveH) : null;
    const wpsBarTrack = showWps ? addTrack('wpsBar', 'bar', barH) : null;
    const goldCurveTrack = showGold ? addTrack('goldCurve', 'curve', curveH) : null;
    const goldBarTrack = showGold ? addTrack('goldBar', 'bar', barH) : null;
    const plotBottom = cursor - sep;
    const laneTop = plotBottom + 10;
    const H = laneTop + lanes * laneH + bottom;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('height', H);
    const tl = g.timeline;
    const wpCurve = g._wps?.curve || [];
    const xValues = [...tl.map(row => row.gc), ...wpCurve.map(row => row[0])];
    const x0 = Math.min(...xValues), x1 = Math.max(...xValues);
    const X = gc => padL + (gc - x0) / (x1 - x0) * (W - padL - padR);
    const blue = css('--blue-team'), red = css('--red-team'), grid = css('--chart-grid'), axis = css('--chart-axis'), acc = css('--accent'), card = css('--bg-card');
    const [upColor, downColor] = [blue, red];
    const sideColor = p => (p.actor === g.blue_team ? blue : p.actor === g.red_team ? red : axis);
    const fmtK = v => (v === 0 ? '0' : (v > 0 ? '+' : '−') + (Math.abs(v) >= 1000 ? Math.abs(v / 1000) + 'k' : Math.abs(v)));
    let s = '';
    const goldGap = d => d;
    const goldMaxRaw = Math.max(1000, ...tl.map(p => Math.abs(p.diff)));
    const goldStep = goldMaxRaw <= 4000 ? 1000 : goldMaxRaw <= 10000 ? 2500 : 5000;
    const goldMax = Math.ceil(goldMaxRaw / goldStep) * goldStep;
    const goldY = d => goldCurveTrack.top + goldCurveTrack.height / 2 - d / goldMax * (goldCurveTrack.height / 2);
    const goldHz = p => p.horizons[S.h];
    const blueFrame = (p, value) => p.actor === g.red_team ? -value : value;
    const goldValue = p => blueFrame(p, goldHz(p).e);
    const goldMeasured = g.plays.filter(p => p.gc != null && goldHz(p) && goldHz(p).state !== 'missing');
    const goldBarRaw = Math.max(1000, ...goldMeasured.map(p => Math.abs(goldValue(p))));
    const goldBarStep = goldBarRaw <= 2000 ? 1000 : goldBarRaw <= 5000 ? 2500 : 5000;
    const goldBarMax = Math.ceil(goldBarRaw / goldBarStep) * goldBarStep;
    const goldBarY = d => goldBarTrack.top + goldBarTrack.height / 2 - d / goldBarMax * (goldBarTrack.height / 2);
    const wpsValue = p => {
      const w = wpsHorizon(p, S.h);
      return w ? blueFrame(p, w.observed_wps_pp) : null;
    };
    const wpsMeasured = showWps ? g.plays.filter(p => p.gc != null && wpsValue(p) != null) : [];
    const wpsRaw = Math.max(5, ...wpsMeasured.map(p => Math.abs(wpsValue(p))));
    const wpsMax = wpsRaw <= 5 ? 5 : wpsRaw <= 10 ? 10 : wpsRaw <= 25 ? 25 : wpsRaw <= 50 ? 50 : Math.ceil(wpsRaw / 25) * 25;
    const wpsCurveY = v => wpsCurveTrack.top + wpsCurveTrack.height - v / 100 * wpsCurveTrack.height;
    const wpsBarY = d => wpsBarTrack.top + wpsBarTrack.height / 2 - d / wpsMax * (wpsBarTrack.height / 2);
    const axisTrack = (track, ticks, Y, format, label) => {
      ticks.forEach(v => {
        s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="${grid}" stroke-width="${v === 0 || v === 50 ? 1.5 : 1}"/>`;
        s += `<text x="${padL - 8}" y="${Y(v) + 4}" text-anchor="end">${format(v)}</text>`;
      });
      s += `<text x="${padL + 6}" y="${track.top + 13}" font-weight="600" style="fill:${css('--text-main')}">${esc(label)}</text>`;
    };
    if (showWps) {
      axisTrack(wpsCurveTrack, [0, 50, 100], wpsCurveY, v => v + '%', t('laneWinProb')(g.blue_team));
      axisTrack(wpsBarTrack, [-wpsMax, 0, wpsMax], wpsBarY, v => (v > 0 ? '+' : '') + v, t('laneWps')(S.h, g.blue_team, g.red_team));
    }
    if (showGold) {
      axisTrack(goldCurveTrack, [-goldMax, 0, goldMax], goldY, fmtK, t('laneGap')(g.blue_team, g.red_team));
      axisTrack(goldBarTrack, [-goldBarMax, 0, goldBarMax], goldBarY, fmtK, t('laneBars')(S.h, g.blue_team, g.red_team));
    }
    const xStep = narrow ? 600 : 300;
    for (let m = Math.ceil(x0 / xStep) * xStep; m <= x1; m += xStep) {
      tracks.forEach(track => { s += `<line x1="${X(m)}" x2="${X(m)}" y1="${track.top}" y2="${track.top + track.height}" stroke="${grid}"/>`; });
      s += `<text x="${X(m)}" y="${H - 6}" text-anchor="middle">${m / 60}:00</text>`;
    }
    const sel = PLAY[S.playId];
    if (sel && sel.gc != null && sel._game === g) {
      const w = Number(S.h);
      const xa = X(sel.gc), xb = X(Math.min(x1, sel.gc + w));
      s += `<rect class="chart-selection-window" x="${xa}" y="${top}" width="${Math.max(2, xb - xa)}" height="${plotBottom - top}" fill="${css('--accent-bg')}"/>`;
      s += `<line class="chart-selection-line" x1="${xa}" x2="${xa}" y1="${top}" y2="${laneTop + lanes * laneH - 4}" stroke="${acc}" stroke-width="1.5"/>`;
    }
    if (showWps) {
      let path = '', prev = null;
      wpCurve.forEach(row => {
        const gc = row[0], probability = 100 * row[2];
        path += (prev === null || gc - prev > 5 ? 'M' : 'L') + X(gc).toFixed(1) + ' ' + wpsCurveY(probability).toFixed(1) + ' ';
        prev = gc;
      });
      s += `<path d="${path}" fill="none" stroke="${upColor}" stroke-width="2.5" stroke-linejoin="round"/>`;
    }
    if (showGold) {
      let path = '', prev = null;
      tl.forEach(p => { path += (prev === null || p.gc - prev > 5 ? 'M' : 'L') + X(p.gc).toFixed(1) + ' ' + goldY(goldGap(p.diff)).toFixed(1) + ' '; prev = p.gc; });
      const zero = goldY(0);
      s += `<clipPath id="cGoldTop"><rect x="0" y="${goldCurveTrack.top}" width="${W}" height="${zero - goldCurveTrack.top}"/></clipPath><clipPath id="cGoldBot"><rect x="0" y="${zero}" width="${W}" height="${goldCurveTrack.top + goldCurveTrack.height - zero}"/></clipPath>`;
      s += `<path d="${path}" fill="none" stroke="${upColor}" stroke-width="2" stroke-linejoin="round" clip-path="url(#cGoldTop)"/>`;
      s += `<path d="${path}" fill="none" stroke="${downColor}" stroke-width="2" stroke-linejoin="round" clip-path="url(#cGoldBot)"/>`;
    }
    const bw = p => Math.max(3, Math.min(10, X(p.gc + Number(S.h)) - X(p.gc)));
    let selectedMarks = '';
    const nearest = (rows, gc, accessor) => rows.reduce((a, b) => Math.abs(accessor(b) - gc) < Math.abs(accessor(a) - gc) ? b : a, rows[0]);
    for (const p of g.plays) {
      if (p.gc == null) continue;
      const on = p.id === S.playId;
      const c = sideColor(p);
      const x = X(p.gc), w = bw(p);
      const opacity = S.playId && !on ? ' opacity="0.3"' : '';
      if (showWps) {
        const value = wpsValue(p);
        let mark = `<line x1="${x}" x2="${x + w}" y1="${wpsBarY(0)}" y2="${wpsBarY(0)}" stroke="${axis}" stroke-width="3"/>`;
        if (value != null) {
          const y = wpsBarY(Math.max(0, value)), hgt = Math.max(1.5, Math.abs(wpsBarY(value) - wpsBarY(0)));
          mark = `<rect x="${x}" y="${y}" width="${w}" height="${hgt}" fill="${c}"/>`;
        }
        const group = `<g class="pin${on ? ' is-selected' : ''}" data-id="${p.id}" style="cursor:pointer"${opacity}><rect x="${x - 4}" y="${wpsBarTrack.top}" width="${w + 8}" height="${wpsBarTrack.height}" fill="transparent"/>${mark}</g>`;
        if (on) selectedMarks += group; else s += group;
        if (wpCurve.length) {
          const point = nearest(wpCurve, p.gc, row => row[0]);
          if (Math.abs(point[0] - p.gc) <= 5) {
            const probability = 100 * point[2];
            s += `<circle class="pin${on ? ' is-selected' : ''}" data-id="${p.id}" cx="${x}" cy="${wpsCurveY(probability)}" r="${on ? 5 : 3}" fill="${on ? c : card}" stroke="${c}" stroke-width="1.5" style="cursor:pointer"/>`;
          }
        }
      }
      if (showGold) {
        const h = goldHz(p);
        let mark = `<line x1="${x}" x2="${x + w}" y1="${goldBarY(0)}" y2="${goldBarY(0)}" stroke="${axis}" stroke-width="3"/>`;
        if (h && h.state !== 'missing') {
          const value = goldValue(p), y = goldBarY(Math.max(0, value)), hgt = Math.max(1.5, Math.abs(goldBarY(value) - goldBarY(0)));
          mark = h.state === 'unresolved'
            ? `<rect x="${x + 0.75}" y="${y + 0.75}" width="${w - 1.5}" height="${Math.max(0.5, hgt - 1.5)}" fill="${card}" stroke="${c}" stroke-width="1.5"/>`
            : `<rect x="${x}" y="${y}" width="${w}" height="${hgt}" fill="${c}"/>`;
        }
        const group = `<g class="pin${on ? ' is-selected' : ''}" data-id="${p.id}" style="cursor:pointer"${opacity}><rect x="${x - 4}" y="${goldBarTrack.top}" width="${w + 8}" height="${goldBarTrack.height}" fill="transparent"/>${mark}</g>`;
        if (on) selectedMarks += group; else s += group;
        const point = nearest(tl, p.gc, row => row.gc);
        if (Math.abs(point.gc - p.gc) <= 5) s += `<circle class="pin${on ? ' is-selected' : ''}" data-id="${p.id}" cx="${x}" cy="${goldY(goldGap(point.diff))}" r="${on ? 5 : 3}" fill="${on ? c : card}" stroke="${c}" stroke-width="1.5" style="cursor:pointer"/>`;
      }
    }
    s += selectedMarks;
    const laneY = i => laneTop + i * laneH;
    s += `<text x="${padL - 8}" y="${laneY(0) + 14}" text-anchor="end">${t('laneFlow')}</text><text x="${padL - 8}" y="${laneY(1) + 14}" text-anchor="end">${t('laneObj')}</text>`;
    for (const r of g.related.filter(r => r.flow_band)) {
      const a = PLAY[r.a], b = PLAY[r.b];
      if (!a || !b || a.gc == null || b.gc == null) continue;
      const xa = X(Math.min(a.gc, b.gc)), xb = X(Math.max(a.gc, b.gc));
      s += `<rect x="${xa}" y="${laneY(0) + 7}" width="${Math.max(3, xb - xa)}" height="7" rx="3" fill="${axis}" fill-opacity="0.55"><title>${a.id} ↔ ${b.id} (${r.gap_s}s)</title></rect>`;
    }
    const OBJ = { herald: 'H', baron: 'B', elder: 'E' };
    for (const c of g.objective_chains) {
      const ids = [c.acquire_play_id, ...c.links.map(x => x.play_id)].filter(Boolean).map(i => PLAY[i]).filter(p => p && p.gc != null);
      if (!ids.length) continue;
      const xs = ids.map(p => X(p.gc));
      const ly = laneY(1) + 10;
      s += `<line x1="${Math.min(...xs)}" x2="${Math.max(...xs)}" y1="${ly}" y2="${ly}" stroke="${acc}" stroke-width="2"/>`;
      ids.forEach(p => {
        const isAcq = p.id === c.acquire_play_id;
        s += `<g class="pin" data-id="${p.id}" style="cursor:pointer"><circle cx="${X(p.gc)}" cy="${ly}" r="${isAcq ? 7 : 4.5}" fill="${isAcq ? acc : card}" stroke="${acc}" stroke-width="2"/>${isAcq ? `<text x="${X(p.gc)}" y="${ly + 4}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:10px">${OBJ[c.objective]}</text>` : ''}<title>${esc(objLabel(c.objective))} · ${esc(c.team)}</title></g>`;
      });
    }
    svg.innerHTML = s;
    svg.classList.toggle('chart-emphasize', emphasize);
    const tip = document.getElementById('tip');
    svg.querySelectorAll('.pin').forEach(el => {
      el.onclick = () => selectPlay(el.dataset.id, true);
      el.onmouseenter = () => {
        const p = PLAY[el.dataset.id], v = viewOf(p), h = v.hz[S.h], w = wpsHorizon(p, S.h);
        const values = [];
        if (showWps) values.push(`WPS <b class="${w ? stateCls(w.observed_wps_pp > 0 ? 'positive' : w.observed_wps_pp < 0 ? 'negative' : 'unresolved') : 'neutral'}">${w ? esc(benefitText(g, p, w.observed_wps_pp, 'wps')) : '—'}</b>`);
        if (showGold) values.push(`${t('metricGold')} <b class="${stateCls(h.state)}">${h.state === 'positive' || h.state === 'negative' ? esc(benefitText(g, p, h.e, 'gold')) : eText(h)}</b>`);
        tip.innerHTML = `<b>${clock(p)}</b> ${esc(p.actor || '?')} · ${esc(v.familyText)}<br>${esc(contentText(p, 'title'))}<br>${t('sec')(S.h)} · ${values.join(' · ')}`;
        tip.style.display = 'block';
      };
      el.onmousemove = ev => {
        const r = svg.parentElement.getBoundingClientRect();
        tip.style.left = Math.min(ev.clientX - r.left + 12, r.width - 290) + 'px';
        tip.style.top = (ev.clientY - r.top + 12) + 'px';
      };
      el.onmouseleave = () => { tip.style.display = 'none'; };
    });
  }

  function ivalBar(h) {
    if (h.state === 'missing') return '<div class="ival"></div>';
    const scale = Math.max(1000, Math.abs(h.e) + h.bound);
    const lo = (h.e - h.bound) / scale, hi = (h.e + h.bound) / scale;
    const left = 50 + lo * 50, width = (hi - lo) * 50;
    const c = h.state === 'positive' ? 'var(--gain)' : h.state === 'negative' ? 'var(--loss)' : 'var(--neutral)';
    return `<div class="ival"><div class="axis"></div><div class="zero"></div><div class="bar" style="left:${left}%;width:${Math.max(width, 1)}%;background:${c}"></div></div>`;
  }

  function playLink(id) {
    const p = PLAY[id];
    return p ? `<button class="linkbtn" data-goto="${id}">${clock(p)} ${esc(contentText(p, 'title'))}</button>` : esc(id);
  }

  // ------------------------------------------------------------------ minimap
  // Positions come per game second as x, y (0-1000, Riot's axes: y up) and quality (4 read on the broadcast view,
  // 3 Riot frame, 2 sure, 1 weak, 0 filled in between, -2 dead, -1 not seen) for each player in g.minimap.players order.
  let mmTimer = null;
  const MM_PLAY = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>';
  const MM_STOP = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="currentColor"/></svg>';
  function mmRow(g, sec) {
    const m = g.minimap;
    const row = m && m.pos[sec - m.t0];
    return row || null;
  }
  function mmSide(g, name) {
    const r = g.roster && g.roster.teams.find(tm => tm.players.some(x => x.player === name));
    return r ? (r.team === g.blue_team ? 'blue' : 'red') : '';
  }
  function minimapHtml(g, p) {
    if (!g.minimap || p.gc == null || !mmRow(g, p.gc)) return '';
    const h = +S.h;
    // A plain drawing of Summoner's Rift: bases, lanes, river.
    const ground = `<rect x="0" y="0" width="1000" height="1000" rx="48" fill="var(--bg-pill)"/>
      <path d="M0 1000 L0 760 A240 240 0 0 0 240 1000 Z" fill="var(--blue-bg)"/><path d="M1000 0 L1000 240 A240 240 0 0 0 760 0 Z" fill="var(--red-bg)"/>
      <path d="M190 250 L810 770" stroke="var(--border-color)" stroke-width="70" stroke-linecap="round" fill="none"/>
      <g stroke="var(--text-muted)" stroke-opacity=".22" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M80 900 L80 80 L900 80"/><path d="M100 920 L920 920 L920 100"/><path d="M130 870 L870 130"/></g>`;
    // The real map from Riot's Data Dragon goes over the drawing, which stays as the fallback if it fails to load.
    const dd = `./assets/ddragon/${g.minimap.ddragon}`;
    return `<div class="mm" id="mm">
      <div class="mm-head"><b>${t('mmHead')}</b><span>${t('mmSrc')}</span></div>
      <svg viewBox="0 0 1000 1000" role="img" aria-label="${esc(t('mmHead'))}">
        <defs><clipPath id="mmMap"><rect width="1000" height="1000" rx="48"/></clipPath>
          <clipPath id="mmIcon" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath></defs>
        ${ground}<image href="${dd}/img/map/map11.png" width="1000" height="1000" preserveAspectRatio="none" clip-path="url(#mmMap)"/>
        <g id="mmTrails"></g><g id="mmDots"></g><g id="mmKills"></g></svg>
      <div class="ctrl"><button class="btn icon" id="mmPlay" type="button" aria-label="${esc(t('mmPlay'))}" title="${esc(t('mmPlay'))}">${MM_PLAY}</button>
        <input type="range" id="mmSlider" min="${-5}" max="${h}" step="1" value="-5" aria-label="${esc(t('mmHead'))}">
        <span class="num" id="mmTime"></span></div>
      <details class="map-guide"><summary>${t('mmGuide')}</summary><p class="note">${t('mmNote')}</p></details></div>`;
  }
  function wireMinimap(g, p) {
    if (mmTimer) { clearInterval(mmTimer); mmTimer = null; }
    const box = document.getElementById('mm');
    if (!box) return;
    const h = +S.h;
    const players = g.minimap.players;
    const named = new Set([...involvedOf(p).map(x => x.player), ...(p.roster_players || [])]);
    const champ = name => { const r = g.roster.teams.flatMap(tm => tm.players).find(x => x.player === name); return r ? (S.lang === 'ko' && r.champion_ko ? r.champion_ko : r.champion) : ''; };
    const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;
    // Movement after the start, one faint line per player (bold for the named ones).
    box.querySelector('#mmTrails').innerHTML = players.map((name, i) => {
      // A line breaks where the player is not seen or moves faster than a champion can (a recall, a misread).
      const runs = [[]];
      let last = null;
      for (let s = p.gc; s <= p.gc + h; s++) {
        const r = mmRow(g, s);
        const pt = r && r[i * 3 + 2] >= 0 ? [r[i * 3], 1000 - r[i * 3 + 1], s] : null;
        if (!pt || (last && Math.hypot(pt[0] - last[0], pt[1] - last[1]) > 100 * (pt[2] - last[2]))) runs.push([]);
        if (pt) { runs[runs.length - 1].push(`${pt[0]},${pt[1]}`); last = pt; }
      }
      const side = mmSide(g, name);
      const bold = named.has(name);
      return runs.filter(r => r.length > 1).map(r => `<polyline points="${r.join(' ')}" fill="none" stroke="#fff" stroke-opacity="${bold ? 0.7 : 0.25}" stroke-width="${bold ? 18 : 12}" stroke-linejoin="round" stroke-linecap="round"/>`
        + `<polyline points="${r.join(' ')}" fill="none" stroke="var(--${side}-team)" stroke-opacity="${bold ? 0.95 : 0.5}" stroke-width="${bold ? 10 : 6}" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
    }).join('');
    const dd = `./assets/ddragon/${g.minimap.ddragon}`;
    const dots = box.querySelector('#mmDots'), slider = box.querySelector('#mmSlider'), clock = box.querySelector('#mmTime');
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // One icon per player, built once and then only moved: rebuilding the images every frame made them flash.
    // Unnamed players first so the named ones sit on top. The icon is drawn around (0, 0) and placed by transform.
    const order = players.map((n, i) => [n, i]).sort((a, b) => named.has(a[0]) - named.has(b[0]));
    dots.innerHTML = order.map(([name, i]) => {
      const side = mmSide(g, name), bold = named.has(name), R = bold ? 54 : 44;
      // The champion's icon in a ring of its side's colour; named players larger with a white outer ring and
      // their name (blue above the icon, red below, so two side by side stay readable).
      const halo = bold ? `<circle r="${R + 9}" fill="none" stroke="#fff" stroke-width="7"/>` : '';
      const label = bold ? `<text y="${side === 'red' ? R + 52 : -R - 22}" text-anchor="middle" font-size="44" font-weight="700" fill="#fff" paint-order="stroke" stroke="rgba(0,0,0,.75)" stroke-width="12">${esc(name)}</text>` : '';
      return `<g class="mm-p" data-i="${i}" style="display:none${calm ? '' : ';transition:transform .25s linear, opacity .25s'}"><title>${esc(name)} · ${esc(champ(name))}</title>`
        + `<circle r="${R}" fill="var(--${side}-team)"/><image href="${dd}/img/champion/${encodeURIComponent(g.minimap.icons[i])}.png" x="${-R}" y="${-R}" width="${2 * R}" height="${2 * R}" clip-path="url(#mmIcon)"/>`
        + `<circle class="ring" r="${R}" fill="none" stroke="var(--${side}-team)" stroke-width="${bold ? 10 : 8}"/>${halo}${label}`
        + `<path class="dead-x" d="M-26 -26 L26 26 M26 -26 L-26 26" stroke="#fff" stroke-width="12" stroke-linecap="round" style="display:none"/></g>`;
    }).join('');
    const nodes = [...dots.querySelectorAll('.mm-p')];
    const seen = {};          // player index -> second last seen
    const draw = d => {
      clock.textContent = t('mmAt')(d, mmss(p.gc + d));
      // A second with no reading (a replay cut, an unread clock) keeps the last frame within 3 s.
      let back = 0, r = mmRow(g, p.gc + d);
      while (!r && back < 3) r = mmRow(g, p.gc + d - ++back);
      if (!r) return;
      // A kill in the last 3 s shows as a cross in the killer's side colour at the spot, fading out.
      const now = p.gc + d;
      box.querySelector('#mmKills').innerHTML = (g.minimap.kills || []).filter(k => k[0] <= now && now - k[0] < 3).map(k => {
        const side = k[3] >= 0 ? mmSide(g, players[k[3]]) : (mmSide(g, players[k[4]]) === 'blue' ? 'red' : 'blue');
        return `<g opacity="${1 - (now - k[0]) / 3}" transform="translate(${k[1]} ${1000 - k[2]})"><circle r="44" fill="none" stroke="var(--${side}-team)" stroke-width="8"/>`
          + `<path d="M-30 -30 L30 30 M30 -30 L-30 30" stroke="var(--${side}-team)" stroke-width="14" stroke-linecap="round"/></g>`;
      }).join('');
      nodes.forEach(n => {
        const i = +n.dataset.i, q = r[i * 3 + 2];
        // Dead (Riot kill record): greyed at the spot where they fell, with a cross, until seen again.
        const dead = q === -2;
        n.style.filter = dead ? 'grayscale(1)' : '';
        n.querySelector('.dead-x').style.display = dead ? '' : 'none';
        if (q >= 0 || dead) {
          const to = `translate(${r[i * 3]}px, ${1000 - r[i * 3 + 1]}px)`;
          if (n.style.display === 'none') {
            // Appearing: place it without sliding in from where it was last (or from the corner).
            const tr = n.style.transition;
            n.style.transition = 'none';
            n.style.display = '';
            n.style.transform = to;
            n.getBoundingClientRect();
            n.style.transition = tr;
          } else {
            n.style.transform = to;
          }
          // Riot frames, the broadcast view and confident matches full, filled-in positions faint with a dashed ring, the dead faded.
          n.style.opacity = dead ? 0.5 : q >= 2 ? 1 : q === 1 ? 0.75 : 0.55;
          n.querySelector('.ring').setAttribute('stroke-dasharray', q === 0 ? '16 10' : 'none');
          seen[i] = d;
        } else if (seen[i] !== undefined && Math.abs(d - seen[i]) <= 2) {
          // Missed for a moment: stay where last seen, faded.
          n.style.opacity = 0.35;
        } else {
          n.style.display = 'none';
        }
      });
    };
    const btn = box.querySelector('#mmPlay');
    const setBtn = playing => { btn.innerHTML = playing ? MM_STOP : MM_PLAY; btn.ariaLabel = btn.title = t(playing ? 'mmPause' : 'mmPlay'); };
    const stop = () => { if (mmTimer) { clearInterval(mmTimer); mmTimer = null; } setBtn(false); };
    const play = () => {
      if (+slider.value >= h) { slider.value = -5; draw(-5); }
      setBtn(true);
      // Four game seconds per real second.
      mmTimer = setInterval(() => {
        const d = +slider.value + 1;
        if (d > h) {
          // Keep the map moving: after the selected window ends, return to the
          // five-second lead-in and play the same sequence again.
          slider.value = -5;
          draw(-5);
          return;
        }
        slider.value = d;
        draw(d);
      }, 250);
    };
    slider.oninput = () => { stop(); draw(+slider.value); };
    btn.onclick = () => (mmTimer ? stop() : play());
    // Opening a play starts the map from 5 s before it, unless the viewer asks for reduced motion.
    slider.value = -5;
    draw(-5);
    if (!calm) play();
  }

  function renderCard(g) {
    const p = PLAY[S.playId];
    const v = viewOf(p);
    const idx = g.plays.indexOf(p);
    const side = p.actor === g.blue_team ? 'blue' : p.actor === g.red_team ? 'red' : '';
    const hzHtml = D.horizons_s.map(hs => {
      const h = v.hz[hs];
      const w = wpsHorizon(p, hs);
      const goldNote = h.state === 'missing' ? L('reason', h.reason) : h.state === 'unresolved' ? t('hzUnres')(h.bound) : t('hzOk')(h.bound);
      const wpsClass = !w ? 'neutral' : stateCls(w.observed_wps_pp > 0 ? 'positive' : w.observed_wps_pp < 0 ? 'negative' : 'unresolved');
      let values;
      if (S.metric === 'wps') values = `<div class="val ${wpsClass}">${w ? fmtPP(w.observed_wps_pp) : '—'}</div><div class="note">${w ? esc(t('wpsProb')(fmtProb(w.p_actor_start), fmtProb(w.p_actor_end))) : t('wpsMissing')}</div>`;
      else if (S.metric === 'gold') values = `<div class="val ${stateCls(h.state)}">${eText(h)}</div><div class="note">${esc(goldNote)}</div>${ivalBar(h)}`;
      else values = `<div class="metric-pair"><span><small>WPS</small><span class="val ${wpsClass}">${w ? fmtPP(w.observed_wps_pp) : '—'}</span></span><span><small>${t('metricGold')}</small><span class="val ${stateCls(h.state)}">${eText(h)}</span></span></div><div class="note">${w ? esc(t('wpsProb')(fmtProb(w.p_actor_start), fmtProb(w.p_actor_end))) : t('wpsMissing')} · ${esc(goldNote)}</div>`;
      return `<button class="hz ${S.h === String(hs) ? 'on' : ''}" data-h="${hs}"><div class="lbl">${t('sec')(hs)}</div>${values}</button>`;
    }).join('');
    const wps = wpsOf(p);
    const boundary = wps?.boundary;
    const boundaryValid = boundary && wps.status === 'valid' && boundary.wps_pp != null;
    const boundaryValue = boundaryValid ? boundary.wps_pp : null;
    const boundaryBefore = boundaryValid ? boundary.p_actor_before : null;
    const boundaryAfter = boundaryValid ? boundary.p_actor_after : null;
    const boundaryClass = boundaryValue == null ? 'neutral' : stateCls(boundaryValue > 0 ? 'positive' : boundaryValue < 0 ? 'negative' : 'unresolved');
    const ctx = p.context;
    const dv = ctx.delta_v;
    const ctxPrimaryRows = [];
    const ctxDetailRows = [];
    ctxPrimaryRows.push([t('ctxOutcome'), `${esc(L('outcome', v.outcome))} · ${t('ctxKill')} ${esc(L('kill', p.kill_status))}`]);
    if (v.leadState) ctxPrimaryRows.push([t('ctxLead'), `${esc(t('leadText')(L('lead', v.leadState), fmtG(v.lead)))} · ${esc(L('phase', ctx.phase))}`]);
    if (v.bgPct != null) ctxPrimaryRows.push([t('ctxBg'), `${esc(t('bgText')(v.bgPct, S.h))} <span class="muted">(${t('bgNote')})</span>`]);
    if (dv) {
      const x = dv.dv;
      ctxDetailRows.push([t('ctxDv'), esc((x >= 0 ? t('dvText') : t('dvTextNeg'))(Math.round(Math.abs(x)).toLocaleString(), Math.round(dv.dv_bound).toLocaleString(), dv.window_s))]);
    }
    if (ctx.overlapping_play_ids[S.h].length) ctxDetailRows.push([t('ctxOverlap')(S.h), ctx.overlapping_play_ids[S.h].map(playLink).join('<br>') + `<br><span class="muted">${t('ctxOverlapNote')}</span>`]);
    if (ctx.minimap_near) {
      const nr = ctx.minimap_near;
      ctxDetailRows.push([t('ctxNear'), (nr.near.length ? nr.near.map(x => `${esc(x.player)} <span class="muted">(${esc(x.team)})</span>`).join(', ') : `<span class="muted">${t('ctxNearNone')}</span>`)
        + `<br><span class="muted">${esc(t('ctxNearNote')(nr.seen.join(', ')))}</span>`]);
    }
    if (ctx.riot_elsewhere) {
      // One line per kill, monster or structure; turret plates, frequent and small, as one count per team.
      const evs = ctx.riot_elsewhere[S.h];
      const mmss = x => `${Math.floor(x / 60)}:${String(Math.floor(x % 60)).padStart(2, '0')}`;
      const lines = evs.filter(e => e.kind !== 'plate').map(e => `<span class="num">${mmss(e.gc)}</span> ${esc(e.team || '?')} `
        + (e.kind === 'kill' ? `${t('riotKind').kill} <span class="muted">${esc(e.by || '—')} → ${esc(e.victim || '?')}</span>`
          : e.kind === 'monster' ? esc(t('riotMonster')[e.monster] || e.monster) : esc(t('riotKind')[e.kind])));
      const plates = {};
      evs.filter(e => e.kind === 'plate').forEach(e => { plates[e.team] = (plates[e.team] || 0) + 1; });
      if (Object.keys(plates).length) lines.push(`${esc(t('riotKind').plate)} ${Object.entries(plates).map(([tm, n]) => `${esc(tm)} ${n}`).join(' · ')}`);
      ctxDetailRows.push([t('ctxElse')(S.h), (lines.length ? lines.join('<br>') : `<span class="muted">${t('ctxElseNone')}</span>`)
        + (lines.length ? `<br><span class="muted">${t('ctxElseNote')}</span>` : '')]);
    }
    const ep = g.episodes.find(e => e.id === p.episode_id);
    if (ep) {
      ctxDetailRows.push([t('ctxEpisode'), ep.play_ids.filter(i => i !== p.id).map(playLink).join('<br>')]);
      const byTeam = {};
      ep.play_ids.forEach(i => involvedOf(PLAY[i]).forEach(x => { (byTeam[x.team] = byTeam[x.team] || new Set()).add(x.player); }));
      const teams = Object.keys(byTeam);
      if (teams.length) ctxDetailRows.push([t('ctxEpPlayers'), teams.map(tm => `${esc(tm)}: ${[...byTeam[tm]].map(esc).join(', ')}`).join(' · ')]);
    }
    if (p.related_play_ids.length) ctxDetailRows.push([t('ctxRelated'), p.related_play_ids.map(playLink).join('<br>')]);
    if (p.objective_links.length) {
      ctxDetailRows.push([t('ctxObj'), p.objective_links.map(o => {
        const head = `<span class="chip fam">${esc(objLabel(o.objective))} · ${esc(L('role', o.role))}</span> ${esc(o.team)}`;
        if (o.role === 'acquire') return head + (o.linked_play_ids.length ? ' → ' + o.linked_play_ids.map(i => `${playLink(i)}${PLAY[i] ? ` <span class="muted">(${esc(objLinkType(PLAY[i], o.chain_id))})</span>` : ''}`).join(', ') : '');
        return head + ` · ${esc(objLabel(o.use_type))}` + (o.acquire_play_id ? ' ← ' + playLink(o.acquire_play_id) : '');
      }).join('<br>')]);
    }
    const tags = [];
    tags.push(`<span class="time">${clock(p)}</span>`);
    tags.push(`<span class="chip ${side}">${esc(p.actor || '?')}</span>`);
    tags.push(famChip(v.famKey, v.familyText, 'dot'));
    if (p.family_secondary) tags.push(`<span class="chip">+ ${esc(famLabel(p.family_secondary))}</span>`);
    if (v.tag) tags.push(`<span class="chip ${tagCls(v.tag)}">${esc(L('tag', v.tag))}</span>`);
    if (p.speech_context === 'retrospective') tags.push(`<span class="chip">${t('retro')}</span>`);
    (hlOf(p.id) || []).forEach(r => tags.push(`<span class="chip highlight-reason">${SPARK_ICON}${esc(L('hl', r))}</span>`));
    const el = document.getElementById('playCard');
    const start = Math.max(0, p.t + (g.video_offset_s || 0) - 5);
    el.innerHTML = `
      <div class="play-head"><div class="left">${tags.join('')}<span class="muted mono" style="font-size:.75rem">${p.id}</span></div>
        <div class="navbtns"><button class="btn" id="prevP" title="${esc(t('keyPrev'))}" ${idx <= 0 ? 'disabled' : ''}><kbd>←</kbd>${t('prevWord')}</button><button class="btn" id="nextP" title="${esc(t('keyNext'))}" ${idx >= g.plays.length - 1 ? 'disabled' : ''}>${t('nextWord')}<kbd>→</kbd></button></div></div>
      <h2 class="play-title">${esc(contentText(p, 'title'))}</h2>
      ${S.lang === 'zh' || S.lang === 'ja' ? `<p class="muted" style="font-size:.74rem;margin-top:-2px">${esc(t('sourceEnglish'))}</p>` : ''}
      ${S.metric !== 'gold' && g._wps ? `<div class="wps-hero"><div class="top"><span><strong>${t('wpsBoundary')}</strong> <span class="metric-beta">${esc(g._wps.model_version)} ${t('beta')}</span></span><span class="value ${boundaryClass}">${boundaryValue == null ? '—' : fmtPP(boundaryValue)}</span></div><div class="prob">${boundaryValid ? esc(t('wpsProb')(fmtProb(boundaryBefore), fmtProb(boundaryAfter))) : t('wpsMissing')}</div>${boundaryValid ? `<div class="window">${esc(t('wpsBoundaryWindow')(boundary.pre_observed_seconds, boundary.post_observed_seconds))}</div>` : ''}<div class="model-note">${t('wpsCausal')}</div></div>` : ''}
      <div class="hz-head"><strong>${t('hzHead')}</strong>${S.metric !== 'gold' && g._wps ? `<span>${t('wpsTotalNote')}</span>` : ''}</div>
      <div class="horizons" aria-label="${esc(t('hzHead'))}">${hzHtml}</div>
      ${involvedOf(p).length ? `<p class="players">${INV_ROLES.map(r => [r, involvedOf(p).filter(x => x.role === r)]).filter(([, xs]) => xs.length)
        .map(([r, xs]) => `<span class="role-lbl">${esc(L('inv', r))}</span> ${xs.map(x => `<button class="linkbtn" data-player="${esc(x.player)}">${esc(playerText(g, x.player))}</button>`).join(', ')}`).join('<br>')}</p>` : ''}
      <p class="desc">${esc(contentText(p, 'desc'))}</p>
      ${p.quote ? `<blockquote class="quote">“${esc(p.quote.replace(/>>\s*/g, ''))}”</blockquote>` : ''}
      <div class="yt"><iframe loading="lazy" src="https://www.youtube.com/embed/${g.youtube_id || g.video_id}?start=${start}" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="VOD"></iframe></div>
      ${location.protocol === 'file:' ? `<p class="yt-note">${t('ytNote')}</p>` : ''}
      <section class="context-summary" aria-labelledby="ctxSummaryTitle">
        <strong class="context-summary-title" id="ctxSummaryTitle">${t('ctxSummary')}</strong>
        <dl class="ctx-primary">${ctxPrimaryRows.map(([k, val]) => `<div class="ctx-item"><dt>${k}</dt><dd>${val}</dd></div>`).join('')}</dl>
        ${ctxDetailRows.length ? `<details class="ctx-more"><summary>${t('ctxMore')(ctxDetailRows.length)}</summary><dl class="ctx">${ctxDetailRows.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join('')}</dl></details>` : ''}
      </section>
      <div class="foot"><span>${t('verification')}</span><a href="${p.yt_url}" target="_blank" rel="noopener">${t('vod')} (${p.video_fmt}) ↗</a></div>
      `;
    const mapEl = document.getElementById('mapSlot');
    const map = minimapHtml(g, p);
    mapEl.innerHTML = map || `<div class="map-empty"><div><h3>${t('mmHead')}</h3><p>${t('mmUnavailable')}</p></div></div>`;
    el.querySelectorAll('.hz').forEach(b => b.onclick = () => { S.h = b.dataset.h; renderSet(); });
    wireMinimap(g, p);
    el.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => selectPlay(b.dataset.goto));
    el.querySelectorAll('[data-player]').forEach(b => b.onclick = () => openStatsEntity('player', b.dataset.player));
    el.querySelector('#prevP').onclick = () => selectPlay(g.plays[idx - 1].id);
    el.querySelector('#nextP').onclick = () => selectPlay(g.plays[idx + 1].id);
    el.scrollTop = 0;
  }

  function objLinkType(p, chainId) {
    const o = p.objective_links.find(x => x.chain_id === chainId && x.role !== 'acquire');
    return o ? `${L('role', o.role)} · ${objLabel(o.use_type)}` : '';
  }

  // One line of involved players: who acted, then who they went after, then who responded.
  function whoLine(p) {
    const inv = involvedOf(p);
    if (!inv.length) return '';
    const names = role => inv.filter(x => x.role === role).map(x => (x.player === S.fPlayer ? `<b>${esc(x.player)}</b>` : esc(x.player)));
    const [a, tg, rs] = [names('actor'), names('target'), names('response')];
    let line = a.join(', ');
    if (tg.length) line += `${line ? ' ' : ''}→ ${tg.join(', ')}`;
    if (rs.length) line += `${line ? ' · ' : ''}${esc(L('inv', 'response'))} ${rs.join(', ')}`;
    return `<span class="who">${line}</span>`;
  }

  const LIST_WPS_SCALE = 20;
  const LIST_GOLD_SCALE = 2000;
  const compactGold = value => {
    const amount = Math.abs(value);
    if (amount < 1000) return amount.toLocaleString();
    const scaled = amount / 1000;
    return `${scaled % 1 ? scaled.toFixed(1) : scaled.toFixed(0)}k`;
  };
  function listMetricDatum(g, actor, value, scale, kind, directional = true) {
    if (value == null) return { shown: '—', side: '', width: '0', clipped: false };
    const amount = Math.abs(value);
    const isZero = kind === 'wps' ? Math.round(amount * 10) === 0 : amount === 0;
    const beneficiary = directional && !isZero && actor ? beneficiaryOf(g, { actor }, value) : null;
    const side = beneficiary === g.blue_team ? 'blue' : beneficiary === g.red_team ? 'red' : '';
    const formatted = kind === 'wps' ? `${amount.toFixed(1)}pp` : compactGold(amount);
    return {
      shown: beneficiary ? `${beneficiary} +${formatted}` : `±${formatted}`,
      side,
      width: Math.min(50, amount / scale * 50).toFixed(2),
      clipped: amount > scale,
    };
  }
  function listMetric(g, actor, label, value, scale, kind, directional = true) {
    const datum = listMetricDatum(g, actor, value, scale, kind, directional);
    return `<span class="metric-block"><span class="sr-only">${esc(label)}: ${esc(datum.shown)}</span><span class="metric-meter ${datum.side ? `side-${datum.side}` : ''}${datum.clipped ? ' clipped' : ''}" style="--meter-width:${datum.width}%" aria-hidden="true"><i class="axis"></i>${datum.side ? '<i class="fill"></i>' : ''}</span><span class="metric-caption" aria-hidden="true"><small>${esc(label)}</small><span class="metric-benefit ${datum.side ? `side-${datum.side}` : 'neutral'}">${esc(datum.shown)}</span></span></span>`;
  }
  function listWpsOverlay(g, actor, instantValue, totalValue, h) {
    const instant = listMetricDatum(g, actor, instantValue, LIST_WPS_SCALE, 'wps');
    const total = listMetricDatum(g, actor, totalValue, LIST_WPS_SCALE, 'wps');
    const fill = (datum, layer) => datum.side ? `<i class="wps-fill ${layer} side-${datum.side}${datum.clipped ? ' clipped' : ''}" style="--meter-width:${datum.width}%"></i>` : '';
    const caption = (datum, label, layer) => `<span class="${layer}"><small>${esc(label)}</small><b class="${datum.side ? `side-${datum.side}` : 'neutral'}">${esc(datum.shown)}</b></span>`;
    return `<span class="metric-block wps-overlay"><span class="sr-only">${esc(t('listInstant'))}: ${esc(instant.shown)} · ${esc(t('listTotal')(h))}: ${esc(total.shown)}</span><span class="metric-meter wps-overlay-meter" aria-hidden="true"><i class="axis"></i>${fill(total, 'total')}${fill(instant, 'instant')}</span><span class="wps-overlay-caption" aria-hidden="true">${caption(instant, t('listInstant'), 'instant')}${caption(total, t('listTotal')(h), 'total')}</span></span>`;
  }

  function valueHeadHelp(g) {
    const all = t('colMetricHelp')(S.h, g.blue_team, g.red_team);
    const keys = S.metric === 'wps' ? ['instant', 'total', 'team'] : S.metric === 'both' ? ['instant', 'total', 'gold', 'team'] : ['gold', 'team'];
    const content = keys.map(key => `<dt>${esc(all[key][0])}</dt><dd>${esc(all[key][1])}</dd>`).join('');
    const label = t('colMetricHelpLabel');
    return `<span class="metric-head-help"><button type="button" aria-label="${esc(label)}" aria-describedby="metricHeadTooltip">?</button><span class="metric-head-tooltip" id="metricHeadTooltip" role="tooltip"><dl>${content}</dl></span></span>`;
  }

  function rowHtml(p, selected) {
    const v = viewOf(p);
    const h = v.hz[S.h];
    const instant = wpsBoundaryOf(p);
    const w = wpsHorizon(p, S.h);
    const g = p._game;
    const side = p.actor === g.blue_team ? 'blue' : p.actor === g.red_team ? 'red' : '';
    const hl = hlOf(p.id);
    const wpsMetric = listWpsOverlay(g, p.actor, instant?.wps_pp ?? null, w?.observed_wps_pp ?? null, S.h);
    const goldMetric = listMetric(g, p.actor, t('metricGold'), h.state === 'missing' ? null : h.e, LIST_GOLD_SCALE, 'gold', ['positive', 'negative'].includes(h.state));
    return `<button type="button" class="row side-${side || 'none'} ${selected ? 'on' : ''} ${hl ? 'star' : ''}" data-id="${p.id}" ${selected ? 'aria-current="true"' : ''} ${hl ? `title="${esc(hl.map(r => L('hl', r)).join(' · '))}"` : ''}>
      <span class="t">${clock(p)}</span><span class="chip ${side}">${esc(p.actor || '?')}</span>
      <span class="title"><span class="ttl">${hl ? `<span class="sr-only">${esc(t('hlOnly'))}</span>` : ''}${S.fPlayer && invOf(p, S.fPlayer) ? `<span class="chip">${esc(L('inv', invOf(p, S.fPlayer).role))}</span> ` : ''}${esc(contentText(p, 'title'))}${p.objective_links.length ? ' <span class="chip fam">' + p.objective_links.map(o => esc(objLabel(o.objective))).join('·') + '</span>' : ''}</span>${whoLine(p)}</span>
      <span class="famcell">${famChip(v.famKey, v.familyText, 'dot')}</span>
      <span class="e metric-cell">${S.metric === 'wps' ? wpsMetric : S.metric === 'both' ? wpsMetric + goldMetric : goldMetric}</span></button>`;
  }

  // Picking a player filters the list without changing how any play is read.
  function pickPlayer(g, name) {
    S.fPlayer = name;
    renderSet();
    document.getElementById('listCard').scrollIntoView({ block: 'start' });
  }

  function renderList(g, previousRows = null) {
    const el = document.getElementById('listCard');
    const tagKeys = [...Object.keys(D.tags)];
    if (['instant', 'wps'].includes(S.listSort) && !g._wps) S.listSort = 'time';
    const list = g.plays.filter(p => {
      const v = viewOf(p);
      if (S.fFamily && p.family !== S.fFamily) return false;
      if (S.fState && v.hz[S.h].state !== S.fState) return false;
      if (S.fTag && v.tag !== S.fTag) return false;
      if (S.fPlayer && !invOf(p, S.fPlayer)) return false;
      if (S.fHl && !hlOf(p.id)) return false;
      return true;
    });
    const chronologicalIndex = new Map(g.plays.map((p, i) => [p.id, i]));
    const magnitude = p => {
      const v = viewOf(p);
      if (S.listSort === 'instant') {
        const instant = wpsBoundaryOf(p);
        return instant ? Math.abs(instant.wps_pp) : null;
      }
      if (S.listSort === 'wps') {
        const w = wpsHorizon(p, S.h);
        return w ? Math.abs(w.observed_wps_pp) : null;
      }
      const h = v.hz[S.h];
      return h.state === 'missing' || h.e == null ? null : Math.abs(h.e);
    };
    if (S.listSort !== 'time') list.sort((a, b) => {
      const av = magnitude(a), bv = magnitude(b);
      if (av == null && bv != null) return 1;
      if (av != null && bv == null) return -1;
      if (av != null && bv != null && bv !== av) return bv - av;
      return chronologicalIndex.get(a.id) - chronologicalIndex.get(b.id);
    });
    const measured = g.plays.filter(p => p.horizons[S.h].state !== 'missing').length;
    const resolved = g.plays.filter(p => ['positive', 'negative'].includes(p.horizons[S.h].state)).length;
    const instantMeasured = g.plays.filter(p => !!wpsBoundaryOf(p)).length;
    const wpsMeasured = g.plays.filter(p => !!wpsHorizon(p, S.h)).length;
    const coverage = S.metric === 'wps' ? t('wpsCoverage')(instantMeasured, wpsMeasured, g.plays.length, S.h)
      : S.metric === 'both' ? t('bothCoverage')(instantMeasured, wpsMeasured, g.plays.length, measured, resolved, S.h)
      : t('listCoverage')(S.h, measured, resolved);
    const valueHead = S.metric === 'wps' ? t('colWps')(S.h) : S.metric === 'both' ? t('colBoth')(S.h) : t('colGold')(S.h);
    const compactValueHead = valueHead;
    const sortOptions = [['time', t('sortTime')], ...(g._wps ? [['instant', t('sortWpsInstant')], ['wps', t('sortWpsTotal')(S.h)]] : []), ['gold', t('sortGold')]];
    el.innerHTML = `<h3>${t('listTitle')} <span class="sub">${t('listSub')(list.length, g.plays.length)}</span></h3>
      <p class="list-coverage">${coverage}</p>
      <div class="list-sort"><label for="listSort">${t('listSortLabel')}</label><select id="listSort" aria-label="${esc(t('listSortLabel'))}">${sortOptions.map(([key, label]) => `<option value="${key}" ${S.listSort === key ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select></div>
      <div class="filters">
        <select id="fFamily"><option value="">${t('fFamily')}</option>${D.families.map(f => `<option value="${f}" ${S.fFamily === f ? 'selected' : ''}>${esc(famLabel(f))}</option>`).join('')}</select>
        <select id="fTag"><option value="">${t('fTag')}</option>${tagKeys.map(k => `<option value="${k}" ${S.fTag === k ? 'selected' : ''}>${esc(L('tag', k))}</option>`).join('')}</select>
        <select id="fState"><option value="">${t('fState')}</option>${STATES.map(k => `<option value="${k}" ${S.fState === k ? 'selected' : ''}>${esc(L('state', k))}</option>`).join('')}</select>
        <select id="fPlayer"><option value="">${t('fPlayer')}</option>${(g.roster ? g.roster.teams : []).map(tm => `<optgroup label="${esc(tm.team)}">${tm.players.map(x => `<option value="${esc(x.player)}" ${S.fPlayer === x.player ? 'selected' : ''}>${esc(posLabel(x.position))} · ${esc(x.player)} · ${esc(champName(x))}</option>`).join('')}</optgroup>`).join('')}</select>
        <label class="highlight-toggle ${S.fHl ? 'on' : ''}"><input class="sr-only" type="checkbox" id="fHl" ${S.fHl ? 'checked' : ''}>${SPARK_ICON}${t('hlOnly')}</label>
        ${S.fFamily || S.fTag || S.fState || S.fPlayer || S.fHl ? `<button class="btn" id="fClear">${t('clearFilters')}</button>` : ''}
      </div>
      <details class="highlight-criteria"><summary><span class="criteria-title">${SPARK_ICON}<span>${t('hlCriteriaTitle')(S.h)}</span></span><span class="criteria-action"><span class="criteria-open">${t('hlCriteriaOpen')}</span><span class="criteria-close">${t('hlCriteriaClose')}</span></span></summary><p>${t('hlCriteria')(S.h)}</p></details>
      ${S.fPlayer ? `<p class="note-box" style="margin:-4px 0 8px">${t('playerNote')}</p>` : ''}
      <div class="rows"><div class="row head"><span>${t('colTime')}</span><span>${t('colTeam')}</span><span>${t('colPlay')}</span><span class="famcell">${t('colType')}</span><span class="e value-head"><span class="value-head-label"><span>${esc(compactValueHead)}</span>${valueHeadHelp(g)}</span><span class="meter-legend"><i class="blue">${esc(g.blue_team)}</i><i class="axis"></i><i class="red">${esc(g.red_team)}</i></span></span></div>${list.map(p => rowHtml(p, p.id === S.playId)).join('')}</div>`;
    el.querySelector('#listSort').onchange = e => {
      const before = rowPositions(el);
      S.listSort = e.target.value;
      try { localStorage.setItem('lv_list_sort', S.listSort); } catch (err) {}
      renderList(g, before);
      writeHash();
    };
    el.querySelector('#fFamily').onchange = e => { S.fFamily = e.target.value; renderList(g); };
    el.querySelector('#fTag').onchange = e => { S.fTag = e.target.value; renderList(g); };
    el.querySelector('#fState').onchange = e => { S.fState = e.target.value; renderList(g); };
    el.querySelector('#fPlayer').onchange = e => { pickPlayer(g, e.target.value); };
    el.querySelector('#fHl').onchange = e => { S.fHl = e.target.checked; renderList(g); };
    const clear = el.querySelector('#fClear');
    if (clear) clear.onclick = () => { S.fFamily = S.fTag = S.fState = ''; S.fHl = false; pickPlayer(g, ''); };
    el.querySelectorAll('.row:not(.head)').forEach(r => r.onclick = () => selectPlay(r.dataset.id, true));
    animateListFlip(el, previousRows);
  }

  // ------------------------------------------------------------------ cross-tab
  function scopeGames() {
    const g = game();
    return S.xScope === 'game' ? [g] : S.xScope === 'stage' ? gamesIn(g.tournament_id).filter(x => seriesOf(x) === seriesOf(g)) : gamesIn(g.tournament_id);
  }
  function scopePlays() { return scopeGames().flatMap(playsOf); }
  function rowKeys() {
    if (S.xRows === 'family') return D.families.map(f => [f, famLabel(f), p => p.family === f, null, null, null, f]);
    if (S.xRows === 'outcome') return OUTCOMES.map(o => [o, L('outcome', o), p => p.outcome === o]);
    if (S.xRows === 'kill') return KILLS.map(k => [k, L('kill', k), p => p.kill_status === k]);
    if (S.xRows === 'player' || S.xRows === 'champ') {
      // One row per player (or champion) in scope, busiest first. A play joins the row of every player it
      // involved, and is read from that player's team: an opponent play counts with its sign flipped.
      const champOf = (p, x) => (ROSTER[p._game.id][x.player] || {}).champion;
      const keyOf = (p, x) => (S.xRows === 'player' ? x.player : champOf(p, x));
      const rows = new Map();
      scopePlays().forEach(p => involvedOf(p).forEach(x => {
        const k = keyOf(p, x);
        if (!k) return;
        if (!rows.has(k)) {
          const r = ROSTER[p._game.id][x.player];
          rows.set(k, { n: 0, roles: {}, label: S.xRows === 'player' ? `${x.player} · ${r.team} ${posLabel(r.position)}` : champName(r) });
        }
        const row = rows.get(k);
        row.n += 1;
        row.roles[x.role] = (row.roles[x.role] || 0) + 1;
      }));
      // Who played each champion (or which champions each player was on), counted by games in scope.
      const pairs = new Map();
      scopeGames().forEach(g => Object.values(ROSTER[g.id]).forEach(x => {
        const [k, other] = S.xRows === 'player' ? [x.player, champName(x)] : [x.champion, `${x.player} (${x.team})`];
        if (!pairs.has(k)) pairs.set(k, new Map());
        pairs.get(k).set(other, (pairs.get(k).get(other) || 0) + 1);
      }));
      const sub = (k, r) => INV_ROLES.filter(role => r.roles[role]).map(role => `${L('inv', role)} ${r.roles[role]}`).join(' · ')
        + ` — ${S.xRows === 'player' ? t('played') : t('usedBy')}: ` + [...(pairs.get(k) || new Map()).entries()]
        .sort((a, b) => b[1] - a[1]).map(([o, n]) => `${o} ${t('games')(n)}`).join(', ');
      const hit = (p, k) => involvedOf(p).find(x => keyOf(p, x) === k);
      // Games in scope the player played (or the champion was picked in), for the per-game column.
      const games = new Map();
      scopeGames().forEach(g => Object.values(ROSTER[g.id]).forEach(x => {
        const k = S.xRows === 'player' ? x.player : x.champion;
        games.set(k, (games.get(k) || 0) + 1);
      }));
      return [...rows.entries()].sort((a, b) => b[1].n - a[1].n || a[1].label.localeCompare(b[1].label))
        .map(([k, r]) => [k, r.label, p => !!hit(p, k), sub(k, r), p => { const x = hit(p, k); return !!x && !!p.actor && x.team !== p.actor; }, p => hit(p, k).team, null, games.get(k) || 0]);
    }
    return D.families.flatMap(f => OUTCOMES.map(o => [`${f}|${o}`, `${famLabel(f)} · ${L('outcome', o)}`, p => p.family === f && p.outcome === o]));
  }
  // A 100% bar of the four states, so the total reads as their sum.
  function sbar(counts, n) {
    return `<span class="sbar" aria-hidden="true">${STATES.map(s => `<i class="${s}" style="width:${n ? 100 * counts[s] / n : 0}%"></i>`).join('')}</span>`;
  }
  function renderXtab() {
    const g = game();
    const plays = scopePlays();
    const h = S.h;
    const rows = rowKeys().map(([k, label, fn, sub, flip, teamOf, famKey, games]) => {
      const ps = plays.filter(fn);
      const flipOf = flip || (() => false);
      const stateOf = p => (flipOf(p) ? FLIP_STATE[p.horizons[h].state] : p.horizons[h].state);
      const by = Object.fromEntries(STATES.map(s => [s, ps.filter(p => stateOf(p) === s)]));
      return { k, label, sub, ps, by, flipOf, teamOf, famKey, games };
    }).filter(r => r.ps.length);
    // Rows sort by the picked column header, gains by default: counts largest first, labels A to Z, and a
    // second click on the same header reverses. Ties fall back to the total, then the label.
    const perPlayer = S.xRows === 'player' || S.xRows === 'champ';
    // Player and champion rows also show gains and losses per game played, and the games; those columns
    // exist only there, and elsewhere a sort on them falls back to gains.
    const PER_GAME = ['positive', 'negative'];
    const { rev } = S.xSort;
    const col = !perPlayer && (S.xSort.col === 'games' || S.xSort.col.endsWith('_pg')) ? 'positive' : S.xSort.col;
    const perGame = (r, st) => (r.games ? r.by[st].length / r.games : 0);
    const count = r => (col === 'total' ? r.ps.length : col === 'games' ? r.games : col.endsWith('_pg') ? perGame(r, col.slice(0, -3)) : r.by[col].length);
    const order = (a, b) => (col === 'label' ? a.label.localeCompare(b.label) : count(b) - count(a) || b.ps.length - a.ps.length || a.label.localeCompare(b.label));
    rows.sort((a, b) => (rev ? -1 : 1) * order(a, b));
    const sortTh = (c, text) => {
      const on = col === c;
      const up = (c === 'label') !== rev;  // A to Z, or smallest first
      const aria = on ? ` aria-sort="${up ? 'ascending' : 'descending'}"` : '';
      const arrow = on ? (up ? '↑' : '↓') : '';
      return `<th${aria}><button type="button" class="sort" data-sort="${c}" aria-label="${esc(t('sortBy')(text || t('rowLabel')))}">${esc(text)}<span class="arr" aria-hidden="true">${arrow}</span></button></th>`;
    };
    const main = document.getElementById('main');
    // The series is named by its two teams: the selected game's label without its game number.
    const scopeName = { game: `${t('scopeGame')} (${contentText(g, 'title')})`, stage: `${t('scopeStage')} (${g.blue_team} vs ${g.red_team})`, all: t('scopeAll') };
    const tot = Object.fromEntries(STATES.map(s => [s, plays.filter(p => p.horizons[h].state === s).length]));
    main.innerHTML = `
      <section class="card">
        <h1 class="xt-title">${t('xtTitle')} <span class="sub">${t('xtSub')}</span></h1>
        <div class="controls" style="margin-top:0;margin-bottom:12px">
          <span class="nav-label">${t('scope')}</span>
          <div class="seg" id="xScope">${['game', 'stage', 'all'].map(k => `<button data-k="${k}" class="${S.xScope === k ? 'on' : ''}">${esc(scopeName[k])}</button>`).join('')}</div>
          <span class="nav-label">${t('rowsBy')}</span>
          <div class="seg" id="xRows">${[['family', t('rFamily')], ['outcome', t('rOutcome')], ['kill', t('rKill')], ['famout', t('rFamOut')]].map(([k, v]) => `<button data-k="${k}" class="${S.xRows === k ? 'on' : ''}">${v}</button>`).join('')}</div>
          <span class="nav-label">${t('horizon')}</span>
          <div class="seg" id="xH">${D.horizons_s.map(x => `<button data-h="${x}" class="${S.h === String(x) ? 'on' : ''}">${t('sec')(x)}</button>`).join('')}</div>
        </div>
        <div class="scroll-x"><table class="xt">
          <thead><tr>${sortTh('label', t('rowLabel'))}${STATES.map(s => (perPlayer && PER_GAME.includes(s)
            ? sortTh(s, `${L('state', s)} (${t('xtCum')})`) + sortTh(`${s}_pg`, `${L('state', s)} (${t('xtPerGame')})`)
            : sortTh(s, L('state', s)))).join('')}${sortTh('total', t('total'))}${perPlayer ? sortTh('games', t('xtGames')) : ''}</tr></thead>
          <tbody>${rows.map(r => `<tr><td>${r.famKey ? `<span class="fam-dot" style="background:var(--f-${r.famKey})"></span>` : ''}${esc(r.label)}${r.sub ? `<div class="rsub">${esc(r.sub)}</div>` : ''}</td>${STATES.map(s => {
            const n = r.by[s].length;
            const key = `${r.k}::${s}`;
            const color = n && s === 'positive' ? 'var(--gain)' : n && s === 'negative' ? 'var(--loss)' : '';
            return `<td class="cell ${n ? '' : 'zero'} ${S.xCell === key ? 'sel' : ''}" data-cell="${esc(key)}" role="button" tabindex="0" aria-pressed="${S.xCell === key}" style="color:${color}">${n}</td>`
              + (perPlayer && PER_GAME.includes(s) ? `<td class="pg" style="color:${color}">${r.games ? perGame(r, s).toFixed(1) : '—'}</td>` : '');
          }).join('')}<td class="tot">${r.ps.length}${sbar(Object.fromEntries(STATES.map(s => [s, r.by[s].length])), r.ps.length)}</td>${perPlayer ? `<td>${r.games}</td>` : ''}</tr>`).join('')}
          ${perPlayer ? '' : `<tr><td><b>${t('total')}</b></td>${STATES.map(s => `<td class="den">${tot[s]}</td>`).join('')}<td class="tot">${plays.length}${sbar(tot, plays.length)}</td></tr>`}</tbody>
        </table></div>
        <p class="note-box">${t('xtNote')}${S.xRows === 'player' || S.xRows === 'champ' ? ' ' + t('xtPlayerNote') : ''}</p>
      </section>
      <section class="card" id="xList"><p class="empty">${t('xtPick')}</p></section>`;
    main.querySelectorAll('#xScope button').forEach(b => b.onclick = () => { S.xScope = b.dataset.k; S.xCell = null; renderXtab(); });
    main.querySelectorAll('#xRows button').forEach(b => b.onclick = () => { S.xRows = b.dataset.k; S.xCell = null; renderXtab(); });
    main.querySelectorAll('#xH button').forEach(b => b.onclick = () => { S.h = b.dataset.h; S.xCell = null; renderXtab(); });
    main.querySelectorAll('th .sort').forEach(b => b.onclick = () => {
      const c = b.dataset.sort;
      S.xSort = { col: c, rev: S.xSort.col === c ? !S.xSort.rev : false };
      renderXtab();
      const again = document.querySelector(`th .sort[data-sort="${c}"]`);
      if (again) again.focus();
    });
    main.querySelectorAll('td.cell').forEach(c => {
      c.onclick = () => { S.xCell = c.dataset.cell; renderXtab(); };
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); c.click(); } };
    });
    if (S.xCell) {
      const [rk, st] = S.xCell.split('::');
      const r = rows.find(x => x.k === rk);
      const ps = r ? r.by[st] : [];
      const box = document.getElementById('xList');
      box.innerHTML = `<h3>${esc(r ? r.label : '')} · ${esc(L('state', st))} <span class="sub">${ps.length} · ${t('sec')(h)}</span></h3>
        <div class="rows">${ps.map(p => `<button type="button" class="row" data-id="${p.id}"><span class="t">${clock(p)}</span><span class="chip">${esc(contentText(p._game, 'stage'))} ${t('gameN')(p._game.game_num)}</span>
          <span class="title">${esc(p.actor || '?')} · ${esc(contentText(p, 'title'))}</span><span class="famcell">${famChip(p.family, famLabel(p.family), 'dot')}</span>
          ${(() => { const hz = p.horizons[h], f = r.flipOf(p), stt = f ? FLIP_STATE[hz.state] : hz.state; return `<span class="e ${stateCls(stt)}">${hz.state === 'missing' ? '—' : fmtG(f ? -hz.e : hz.e)}</span>`; })()}</button>`).join('')}</div>`;
      box.querySelectorAll('.row').forEach(row => row.onclick = () => {
        const p = PLAY[row.dataset.id];
        S.view = 'set'; S.gameId = p._game.id; S.playId = p.id;
        render(); window.scrollTo({ top: 0 });
      });
    }
    writeHash();
    syncPressed();
  }
