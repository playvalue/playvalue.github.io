        ${selectable ? `<div class="stats-team-picks"><label class="stats-pick a"><span>${t('statsPickTeamA')}</span><select id="statsTeamA">${options(S.statsTeamA)}</select></label><label class="stats-pick b"><span>${t('statsPickTeamB')}</span><select id="statsTeamB">${options(S.statsTeamB)}</select></label></div>` : ''}</div>
      ${gs.length ? `${comparisonNarrative(a, b, true)}${comparisonDifference(a, b, true)}<div class="stats-team-layout"><div class="stats-radar-wrap">${radarSvg(a, b)}<div class="stats-legend"><span><i class="a"></i>${esc(a.team)}</span><span><i class="b"></i>${esc(b.team)}</span></div></div>
        <div class="stats-team-cards">${teamCard(a, 'blue', gs)}${teamCard(b, 'red', gs)}</div></div>
      ` : `<p class="empty">${t('statsNoData')}</p>`}
      <p class="note-box">${t('statsCaveat')}</p>
    </section>`;
  }
  function buildEntities(kind, gs) {
    const rows = new Map();
    const get = (key, label) => {
      if (!rows.has(key)) rows.set(key, { key, label, games: new Set(), teams: new Map(), positions: new Map(), players: new Map(), champs: new Map(), obs: [] });
      return rows.get(key);
    };
    gs.forEach(g => Object.values(ROSTER[g.id] || {}).forEach(r => {
      const key = kind === 'player' ? r.player : r.champion;
      if (!key) return;
      const row = get(key, kind === 'player' ? r.player : champName(r));
      row.games.add(g.id); row.teams.set(r.team, (row.teams.get(r.team) || 0) + 1); row.positions.set(r.position, (row.positions.get(r.position) || 0) + 1);
      row.players.set(r.player, (row.players.get(r.player) || 0) + 1); row.champs.set(r.champion, (row.champs.get(r.champion) || 0) + 1);
    }));
    gs.forEach(g => playsOf(g).forEach(p => involvedOf(p).forEach(x => {
      const r = ROSTER[g.id]?.[x.player];
      if (!r) return;
      const key = kind === 'player' ? x.player : r.champion, row = rows.get(key);
      if (!row) return;
      const value = statValue(p, x.team), goldState = statState(p, x.team, value);
      row.obs.push({ p, game: g, team: x.team, role: x.role, player: x.player, roster: r, value, goldState });
    })));
    const summary = row => {
      const valid = row.obs.filter(x => x.value != null), pos = valid.filter(x => x.value > 0), neg = valid.filter(x => x.value < 0);
      const posSum = pos.reduce((s, x) => s + x.value, 0), negSum = neg.reduce((s, x) => s - x.value, 0), games = row.games.size;
      return { valid, pos, neg, posSum, negSum, posPerGame: games ? posSum / games : 0, negPerGame: games ? negSum / games : 0, median: median(valid.map(x => Math.abs(x.value))), netPerGame: games ? (posSum - negSum) / games : 0 };
    };
    return [...rows.values()].filter(row => row.obs.length).map(row => ({ ...row, summary: summary(row) }))
      .sort((a, b) => b.summary.netPerGame - a.summary.netPerGame || b.summary.valid.length - a.summary.valid.length || a.label.localeCompare(b.label));
  }
  const topKey = map => [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0]?.[0] || '';
  function entitySubtitle(row, kind) {
    const teams = [...row.teams.keys()].join(' / '), pos = posLabel(topKey(row.positions));
    if (kind === 'player') {
      const champs = [...row.champs.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([id]) => {
        const o = row.obs.find(x => x.roster.champion === id)?.roster; return o ? champName(o) : id;
      }).join(', ');
      return `${teams} · ${pos}${champs ? ` · ${champs}` : ''}`;
    }
    return `${pos} · ${[...row.players.keys()].join(', ')}`;
  }
  function dotplotSvg(row) {
    const obs = row.summary.valid, W = 760, H = 270, left = 72, right = 708;
    const raw = Math.max(...obs.map(x => Math.abs(x.value)), S.statsMetric === 'wps' ? 1 : 100);
    const step = S.statsMetric === 'wps' ? (raw <= 5 ? 1 : raw <= 20 ? 5 : 10) : (raw <= 2000 ? 500 : raw <= 5000 ? 1000 : 2000);
    const max = Math.ceil(raw / step) * step, xOf = v => left + (v + max) / (2 * max) * (right - left);
    const roleY = { actor: 78, target: 143, response: 208 };
    const shape = (o, i) => {
      const phase = phaseOfPlay(o.p), x = xOf(o.value), y = roleY[o.role] + ((i % 5) - 2) * 4, fill = PHASE_COLORS[phase] || 'var(--text-muted)';
      const common = `class="pin" data-play="${esc(o.p.id)}" tabindex="0" role="button" fill="${fill}" fill-opacity=".86" stroke="var(--bg-card)" stroke-width="1.5"`;
      const mark = o.role === 'target' ? `<rect ${common} x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})"/>` : o.role === 'response' ? `<path ${common} d="M${x} ${y - 7} L${x + 7} ${y + 6} L${x - 7} ${y + 6} Z"/>` : `<circle ${common} cx="${x}" cy="${y}" r="6"/>`;
      return `${mark}<title>${esc(`${clock(o.p)} · ${t('statsPhaseShort')[phase]} · ${contentText(o.p, 'title')} · ${fmtStat(o.value)}`)}</title>`;
    };
    return `<svg class="stats-dotplot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('statsFingerprint'))}">
      <rect x="${left}" y="40" width="${(right - left) / 2}" height="205" fill="var(--loss)" opacity=".035"/><rect x="${(left + right) / 2}" y="40" width="${(right - left) / 2}" height="205" fill="var(--gain)" opacity=".035"/>
      ${INV_ROLES.map(role => `<line x1="${left}" y1="${roleY[role]}" x2="${right}" y2="${roleY[role]}" stroke="var(--chart-grid)"/><text x="8" y="${roleY[role] + 4}">${esc(L('inv', role))}</text>`).join('')}
      <line x1="${xOf(0)}" y1="30" x2="${xOf(0)}" y2="245" stroke="var(--chart-axis)"/>
      <text x="${left}" y="25" text-anchor="start">${esc(t('statsBad'))} ${esc(fmtStat(-max))}</text><text x="${right}" y="25" text-anchor="end">${esc(t('statsGood'))} ${esc(fmtStat(max))}</text>
      ${obs.map(shape).join('')}
    </svg>`;
  }
  function entityDetail(row, kind, side = '', showCaveat = true, referenceRows = []) {
    if (!row) return `<section class="card"><p class="empty">${t('statsNoData')}</p></section>`;
    const scenePerspective = kind === 'player' ? topKey(row.teams) : t('statsTeam');
    const roles = Object.fromEntries(INV_ROLES.map(role => [role, row.obs.filter(x => x.role === role).length]));
    const phases = Object.fromEntries(['lane', 'mid', 'late'].map(phase => [phase, row.summary.valid.filter(x => phaseOfPlay(x.p) === phase).length]));
    const states = Object.fromEntries(STATES.map(state => [state, row.obs.filter(x => x.goldState === state).length]));
    const types = [...row.obs.reduce((m, x) => m.set(x.p.family, (m.get(x.p.family) || 0) + 1), new Map()).entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
    const gainScenes = [...row.summary.valid].filter(x => x.value > 0).sort((a, b) => b.value - a.value).slice(0, 3);
    const lossScenes = [...row.summary.valid].filter(x => x.value < 0).sort((a, b) => a.value - b.value).slice(0, 3);
    const sceneRows = scenes => scenes.map(o => `<button type="button" class="scene" data-play="${esc(o.p.id)}"><span>${clock(o.p)}</span><span class="actor">${esc(o.p.actor || '—')}</span><span>${esc(contentText(o.p, 'title'))}</span><span class="v ${o.value >= 0 ? 'gain' : 'loss'}">${esc(fmtStat(o.value))}</span></button>`).join('');
    return `<section class="card ${side ? `stats-compare-card side-${side}` : ''}">
      <div class="stats-detail-head"><div><h2 class="${side === 'a' ? 'team-blue' : side === 'b' ? 'team-red' : ''}">${esc(row.label)}</h2><p>${esc(entitySubtitle(row, kind))}</p></div><div class="stats-mini-grid">
        <div class="stats-mini"><small>${t('statsGames')}</small><strong>${row.games.size}</strong></div>
        <div class="stats-mini"><small>${t('statsScenes')}</small><strong>${row.summary.valid.length}</strong></div>
        <div class="stats-mini"><small>${t('statsToward')}</small><strong>${pct0(row.summary.pos.length, row.summary.valid.length)}</strong></div>
        <div class="stats-mini"><small>${t('statsMedian')}</small><strong>${fmtStatAbs(row.summary.median)}</strong></div>
        <div class="stats-mini"><small>${t('statsPerGame')}</small><strong class="${row.summary.netPerGame > 0 ? 'gain' : row.summary.netPerGame < 0 ? 'loss' : 'neutral'}">${fmtStat(row.summary.netPerGame)}</strong></div>
      </div></div>
      ${entityNarrative(row, referenceRows)}
      <h3 style="margin-top:16px">${t('statsFingerprint')} <span class="sub">${esc(statsWindowLabel())} · ${S.statsMetric === 'wps' ? t('statsWps') : t('statsGold')}</span></h3>
      ${row.summary.valid.length ? dotplotSvg(row) : `<p class="empty">${t('statsNoData')}</p>`}
      <div class="stats-role-key">${INV_ROLES.map(role => `<span><i class="${role}"></i>${esc(L('inv', role))} ${roles[role]}</span>`).join('')}</div>
      <div class="stats-phase-key"><strong>${esc(t('statsPhaseLegend'))}</strong>${['lane', 'mid', 'late'].map(phase => `<span><i style="background:${PHASE_COLORS[phase]}"></i>${esc(t('statsPhaseShort')[phase])} ${phases[phase]}</span>`).join('')}</div>
      <div class="stats-detail-grid"><div class="stats-breakdown">
        <h3>${t('statsGoldBreak')}</h3><div class="stats-state-grid">${STATES.map(state => `<div><span>${esc(L('state', state))}</span><strong>${states[state]}</strong></div>`).join('')}</div>
        <h3 style="margin-top:14px">${t('statsTypes')}</h3><div class="stats-type-list">${types.map(([family, n]) => `${famChip(family, famLabel(family))}<span class="chip">${n}</span>`).join('')}</div>
      </div><div class="stats-scenes"><h3>${t('statsTopScenes')}</h3>${gainScenes.length ? `<div class="stats-scene-group gain"><h4>${esc(t('statsTopGainScenes')(scenePerspective))}</h4>${sceneRows(gainScenes)}</div>` : ''}${lossScenes.length ? `<div class="stats-scene-group loss"><h4>${esc(t('statsTopLossScenes')(scenePerspective))}</h4>${sceneRows(lossScenes)}</div>` : ''}${!gainScenes.length && !lossScenes.length ? `<p class="empty">${t('statsNoData')}</p>` : ''}</div></div>
      ${showCaveat ? `<p class="note-box">${t('statsCaveat')}</p>` : ''}
    </section>`;
  }
  function renderPlayerStats(gs) {
    const rows = buildEntities('player', gs), byKey = new Map(rows.map(row => [row.key, row])), choices = playerChoices();
    const options = selected => choices.map(row => `<option value="${esc(row.key)}" ${row.key === selected ? 'selected' : ''}>${esc(playerChoiceLabel(row))}</option>`).join('');
    const roles = [['all', t('statsAllPositions')], ...STAT_POSITIONS.map(pos => [pos, posLabel(pos)])];
    return `<section class="card"><div class="stats-compare-bar">
      <div class="stats-compare-picks"><label class="stats-pick a"><span>${t('statsPickPlayerA')}</span><select id="statsPlayerA">${options(S.statsPick)}</select></label><label class="stats-pick b"><span>${t('statsPickPlayerB')}</span><select id="statsPlayerB">${options(S.statsCompare)}</select></label></div>
      <label class="stats-pick stats-role-pick"><span>${t('statsPosition')}</span><select id="statsRole">${roles.map(([key, label]) => `<option value="${key}" ${key === S.statsRole ? 'selected' : ''}>${esc(label)}</option>`).join('')}</select></label>
    </div></section>
    ${gs.length ? `<div>${comparisonNarrative(byKey.get(S.statsPick), byKey.get(S.statsCompare))}${comparisonDifference(byKey.get(S.statsPick), byKey.get(S.statsCompare))}<div class="stats-compare-layout">${entityDetail(byKey.get(S.statsPick), 'player', 'a', false, rows)}${entityDetail(byKey.get(S.statsCompare), 'player', 'b', false, rows)}</div><p class="note-box">${t('statsCaveat')}</p></div>` : `<section class="card"><p class="empty">${t('statsNoData')}</p></section>`}`;
  }
  function renderEntityStats(gs, kind) {
    const rows = buildEntities(kind, gs);
    if (!rows.some(x => x.key === S.statsPick)) S.statsPick = rows[0]?.key || '';
    const chosen = rows.find(x => x.key === S.statsPick), maxSide = Math.max(1, ...rows.flatMap(x => [x.summary.posPerGame, x.summary.negPerGame]));
    const listTitle = kind === 'player' && S.view === 'stats' ? t('statsPlayerList') : kind === 'player' ? t('statsComparePlayer') : t('statsCompareChamp');
    const list = `<section class="card stats-entity-list"><h3>${listTitle}</h3>${rows.map(row => {
      const neg = Math.min(50, row.summary.negPerGame / maxSide * 50), pos = Math.min(50, row.summary.posPerGame / maxSide * 50), net = row.summary.netPerGame;
      return `<button type="button" class="stats-entity-row ${row.key === S.statsPick ? 'on' : ''}" data-entity="${esc(row.key)}" title="${esc(`${t('statsPerGame')}: ${fmtStat(net)}`)}"><span class="name">${esc(row.label)}</span><span class="meta">${esc(t('games')(row.games.size))}</span><span class="stats-diverge"><i class="neg" style="width:${neg}%"></i><i class="pos" style="width:${pos}%"></i></span><span class="n ${net > 0 ? 'gain' : net < 0 ? 'loss' : 'neutral'}">${esc(fmtStat(net))}</span></button>`;
    }).join('') || `<p class="empty">${t('statsNoData')}</p>`}</section>`;
    return `<div class="stats-entity-layout">${list}${entityDetail(chosen, kind, '', true, rows)}</div>`;
  }
  function renderStats() {
    if (!WPS_INDEX && S.statsMetric === 'wps') S.statsMetric = 'gold';
    normalizeStatsSelections();
    const gs = statsGames(), teams = [...new Set(gs.flatMap(g => [g.blue_team, g.red_team]))];
    const main = document.getElementById('main');
    main.innerHTML = `<section class="card"><div class="stats-head"><div><h1 class="xt-title">${esc(teams.join(' vs '))} · ${t('statsTitle')}</h1><p class="stats-sub">${t('statsSub')}</p></div><button type="button" class="btn stats-open-compare" id="statsOpenCompare">${t('statsOpenCompare')}</button></div>${statsControls()}</section>
      ${S.statsTab === 'team' ? renderTeamStats(gs, teams, false) : renderEntityStats(gs, 'player')}`;
    wireStatsControls();
    main.querySelector('#statsOpenCompare').onclick = () => S.statsTab === 'team' ? openCompare('team', S.statsTeamA, S.statsTeamB) : openCompare('player', S.statsPick);
    main.querySelectorAll('[data-stats-player]').forEach(el => el.onclick = () => openStatsEntity('player', el.dataset.statsPlayer));
    main.querySelectorAll('[data-entity]').forEach(el => el.onclick = () => { S.statsPick = el.dataset.entity; renderStats(); });
    wireStatsPlayLinks(main);
    writeHash(); syncPressed(); main.removeAttribute('aria-busy');
  }
  function wireStatsPlayLinks(main) {
    main.querySelectorAll('[data-play]').forEach(el => {
      el.onclick = () => openStatsPlay(el.dataset.play);
      el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openStatsPlay(el.dataset.play); } };
    });
  }
  function renderCompare() {
    if (!WPS_INDEX && S.statsMetric === 'wps') S.statsMetric = 'gold';
    normalizeStatsSelections();
    const gs = statsGames(), teams = statsEventTeams();
    const main = document.getElementById('main');
    main.innerHTML = `<section class="card"><div class="stats-head"><div><h1 class="xt-title">${t('compareTitle')}</h1><p class="stats-sub">${t('compareSub')}</p></div></div>${statsControls()}</section>
      ${S.statsTab === 'team' ? renderTeamStats(gs, teams, true) : renderPlayerStats(gs)}`;
    wireStatsControls();
    const a = main.querySelector('#statsTeamA'), b = main.querySelector('#statsTeamB');
    if (a) a.onchange = () => { S.statsTeamA = a.value; if (S.statsTeamB === a.value) S.statsTeamB = teams.find(x => x !== a.value) || a.value; render(); };
    if (b) b.onchange = () => { S.statsTeamB = b.value; if (S.statsTeamA === b.value) S.statsTeamA = teams.find(x => x !== b.value) || b.value; render(); };
    const playerA = main.querySelector('#statsPlayerA'), playerB = main.querySelector('#statsPlayerB'), role = main.querySelector('#statsRole');
    if (playerA) playerA.onchange = () => { S.statsPick = playerA.value; if (S.statsCompare === S.statsPick) S.statsCompare = playerChoices().find(x => x.key !== S.statsPick)?.key || S.statsPick; render(); };
    if (playerB) playerB.onchange = () => { S.statsCompare = playerB.value; if (S.statsPick === S.statsCompare) S.statsPick = playerChoices().find(x => x.key !== S.statsCompare)?.key || S.statsCompare; render(); };
    if (role) role.onchange = () => { S.statsRole = role.value; S.statsPick = ''; S.statsCompare = ''; render(); };
    main.querySelectorAll('[data-stats-player]').forEach(el => el.onclick = () => openCompare('player', el.dataset.statsPlayer));
    wireStatsPlayLinks(main);
    writeHash(); syncPressed(); main.removeAttribute('aria-busy');
  }

  // ------------------------------------------------------------------ main
  function renderPlanned() {
    document.getElementById('main').innerHTML = `<section class="card planned"><h3 style="justify-content:center">${t('plannedTitle')}</h3><p class="muted">${t('plannedBody')}</p></section>`;
  }
  async function render() {
    renderChrome();
    const tour = DATA.tournaments.find(x => x.id === S.tourn);
    if (tour.status === 'planned') return renderPlanned();
    const main = document.getElementById('main');
    const wait = `<section class="card"><p class="muted">${t('loading')}</p></section>`;
    main.setAttribute('aria-busy', 'true');
    try {
      if (S.view === 'xtab') {
        if (!tour._plays) main.innerHTML = wait;
        await ensurePlays(S.tourn);
        if (S.view === 'xtab') renderXtab();
      } else if (S.view === 'stats' || S.view === 'compare') {
        if (!tour._plays) main.innerHTML = wait;
        await ensurePlays(S.tourn);
        normalizeStatsSelections();
        const ids = statsGames().map(g => g.id);
        if (S.statsMetric === 'wps' && WPS_INDEX) await Promise.all(ids.map(ensureWps));
        if (S.view === 'stats') renderStats();
        if (S.view === 'compare') renderCompare();
      } else {
        const id = S.gameId;
        if (!isFull(game())) main.innerHTML = wait;
        await Promise.all([ensureGame(id), ensureWps(id)]);
        if (S.view === 'set' && S.gameId === id) renderSet();
      }
    } catch (e) {
      main.innerHTML = `<section class="card"><p>${t('loadError')}</p></section>`;
    }
    main.setAttribute('aria-busy', 'false');
    syncPressed();
  }
  const langButton = document.getElementById('btnLang');
  const langMenu = document.getElementById('langMenu');
  const closeLangMenu = () => { langMenu.hidden = true; langButton.setAttribute('aria-expanded', 'false'); };
  langButton.onclick = e => {
    e.stopPropagation();
    langMenu.hidden = !langMenu.hidden;
    langButton.setAttribute('aria-expanded', String(!langMenu.hidden));
    if (!langMenu.hidden) langMenu.querySelector('.lang-option.on')?.focus();
  };
  langMenu.querySelectorAll('.lang-option').forEach(option => option.onclick = e => {
    e.stopPropagation();
    S.lang = option.dataset.lang;
    try { localStorage.setItem('lv_lang', S.lang); } catch (err) {}
    closeLangMenu();
    um('language', { to: S.lang });
    render();
  });
  document.addEventListener('click', e => { if (!e.target.closest('.lang-picker')) closeLangMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !langMenu.hidden) { closeLangMenu(); langButton.focus(); } });
  document.getElementById('btnTheme').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('lv_theme', S.theme); } catch (e) {} render(); };
  render();
  // Runs after each control's own handler, so the state already shows the choice.
  document.addEventListener('click', e => {
    const el = e.target.closest('#btnTheme, #mmPlay, [data-h], button.row[data-id], a[href*="youtube.com/"]');
    if (!el) return;
    if (el.id === 'btnTheme') um('theme', { to: S.theme });
    else if (el.id === 'mmPlay') { if (el.title === t('mmPause')) um('map-play', { game: S.gameId }); }
    else if (el.dataset.h) um('horizon', { h: el.dataset.h });
    else if (el.dataset.id) um('play-open', { game: (PLAY[el.dataset.id] || {})._game?.id || S.gameId, view: S.view });
    else um('vod-link', { game: S.gameId });
  });
  // ← → step through the game's plays, unless the viewer is typing in or choosing from a field.
  document.addEventListener('keydown', e => {
    if (S.view !== 'set' || e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const p = PLAY[S.playId];
    if (!p || !p._game.plays) return;
    const list = p._game.plays, i = list.indexOf(p) + (e.key === 'ArrowRight' ? 1 : -1);
    if (i >= 0 && i < list.length) { e.preventDefault(); selectPlay(list[i].id); }
  });
  // The chart is drawn in pixels of its frame, so redraw it when the frame changes width.
  let lastW = 0, resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const svg = document.getElementById('chart');
      const w = svg && svg.parentElement.clientWidth;
      if (svg && w && w !== lastW && S.view === 'set' && PLAY[S.playId]) { lastW = w; renderChart(PLAY[S.playId]._game); }
    }, 150);
  });
})();
</script>
